<BODY scroll=auto><P>北非最强大的两支军队——利比亚和埃及——未必与北约或华约任何一方结盟。利比亚理论上是苏联的附庸国，但利比亚独裁者卡扎菲以将自身存续置于一切之上而臭名昭著。与此同时，美国花费数十亿美元援助，试图说服埃及加入西方势力范围。</P>
<P>本场景改编自 Michael A. Palmer 所著《<U>The War That Never Was</U>》一书，开场时利比亚和埃及的中立立场都存疑。卡扎菲会站在苏联一边吗？美国能兑现那些埃及欠下的所有“欠条”吗？</P>
<P>这是一个中等规模场景，以激烈的空战和协同空中打击为特色。</P></BODY>
