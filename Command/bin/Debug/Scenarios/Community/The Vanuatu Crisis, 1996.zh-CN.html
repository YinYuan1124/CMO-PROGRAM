<BODY scroll=auto><P>1996年，小岛国瓦努阿图发生了一次未遂政变。&nbsp; 叛乱的主要原因之一是影响国家警察部队的薪资纠纷——瓦努阿图没有常备军，警察部队是其最接近军队的力量。&nbsp; </P>
<P>历史上，&nbsp;这场危机很快得到解决。&nbsp; 本剧本假定危机升级，最终由一个革命政府夺取了政权。&nbsp; 数周后，&nbsp;瓦努阿图陷入混乱。</P>
