<BODY scroll=auto><P>北约对利比亚的开局行动取得了巨大成功。的黎波里周边的利比亚综合防空系统（IADS）几乎已被瓦解，第26海军陆战队远征队（26th MEU）的海军陆战队员已在祖瓦拉（Zuwara）成功登陆。最初的抵抗非常微弱，海军陆战队已推进至距的黎波里25英里处。</P>
<P>与此同时，北约的军事胜利在外交层面也收到了成效。埃及已同意进攻利比亚，并将开始向图卜鲁格（Tubruq）推进。</P>
<P>利比亚军队会在两线进攻的重压下崩溃吗？还是“疯狂上校”还有什么锦囊妙计？</P>
<P>本剧本改编自 Michael A. Palmer 所著的《<U>The War That Never Was</U>》（从未发生的战争），大量运用航空兵支援地面部队。</P></BODY>
