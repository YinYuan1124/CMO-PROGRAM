<BODY scroll=auto><P>2012 年 6 月，叙利亚防空部队击落了一架土耳其 RF-4，两名机组人员丧生，这为安卡拉与大马士革之间的对抗关系定下了基调——其间土耳其空军（TuAF）击落了多架叙利亚飞机，以及最近的一架俄罗斯 Su-24。</P>
<P>本剧本讲述的是土耳其人转而从海上反击，派出一艘潜艇去击沉两艘叙利亚轻型护卫舰。然而，阿萨德政权及其盟友已为任何反击做好了准备……</P>
<P>剧本作者：Coiler12。</P></BODY>
