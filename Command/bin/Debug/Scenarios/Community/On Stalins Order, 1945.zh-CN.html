<body scroll=auto><P><STRONG>苏联</STRONG><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><?xml:namespace prefix = "st1" ns = "urn:schemas-microsoft-com:office:smarttags" /><st1:country-region w:st="on"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG><st1:country-region w:st="on"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">&nbsp;vs.&nbsp;盟军部队</SPAN></st1:country-region><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p><FONT size=3>&nbsp;</FONT></o:p></SPAN></STRONG></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN><FONT size=3><STRONG>日期/时间：</STRONG> 1945 年 7 月 1 日 / 06:00:00 Zulu<o:p></o:p></FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN><FONT size=3><STRONG>地点：</STRONG> 捷克斯洛伐克</FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN></SPAN><SPAN></SPAN><SPAN></SPAN><SPAN><FONT size=3><STRONG>可玩方</STRONG>：苏联</FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN><FONT size=3><st1:country-region w:st="on"></st1:country-region></FONT></SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><o:p><FONT size=3>&nbsp;</FONT></o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><U><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG><FONT size=3>引言<o:p></o:p></FONT></STRONG></SPAN></U></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><o:p><FONT size=3>&nbsp;</FONT></o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">本想定假设战后捷克斯洛伐克的短暂划分与莫斯科在雅尔塔会议上所期待和商定的情况相去甚远。苏联政治局与斯大林达成一致，要加快将捷克斯洛伐克纳入苏联势力范围。收复该国西部的重工业实在太重要了，不容忽视。唯一剩下的问题是该地区仍有少量盟军部队存在。</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">虚构想定。</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">想定作者：DeltaIV</SPAN></P></SPAN></st1:country-region></SPAN></body>
