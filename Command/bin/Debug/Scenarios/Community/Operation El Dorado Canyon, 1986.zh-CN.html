<BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent">
<P id=docs-internal-guid-8e4ed8ff-7fff-78ae-d968-9fc1a54cc1a1 style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: 'Courier New'; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><SPAN id=docs-internal-guid-a270d5b1-7fff-a824-86e0-3a908c6e2348 style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>1986 年 4 月 5 日，恐怖分子在柏林一家夜总会引爆了一枚炸弹。炸弹炸死 2 名美国士兵和 1 名土耳其妇女，另有 229 人受伤，其中 79 人是美国人。</FONT></SPAN></SPAN></P>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: 'Courier New'; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white></FONT></SPAN></SPAN>&nbsp;</P>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: 'Courier New'; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><SPAN id=docs-internal-guid-8ffa8ea5-7fff-1ea8-1183-ca7e893c2cb5 style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>作为回应，美国以有证据表明利比亚政府对此负责为由，美国总统 Ronald Reagan（罗纳德·里根）下令于 4 月 14/15 日夜间对利比亚发动空袭，代号“黄金峡谷”行动（OPERATION EL DORADO CANYON）。</FONT></SPAN></SPAN></SPAN></P></SPAN></BODY>
