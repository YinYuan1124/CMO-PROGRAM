<BODY scroll=auto><P>由于控制了75%的边界，苏联完全掌控了黑海。但由于世界上最壮观的地质特征之一——博斯普鲁斯海峡，这并未带来多少战略优势。这条狭窄的水道两岸均由土耳其控制，是黑海通往世界其他地区的唯一通道。</P>
<P>本场景改编自 Michael A. Palmer 的著作《<U>从未发生过的战争</U>》（The War That Never Was），要求苏军用武力打通海峡。这需要空中、地面和海上力量之间的精心协同。</P></BODY>
