<BODY scroll=auto><P>本场景假定 20 世纪 80 年代初坦桑尼亚发生了一场政变，新政府对肯尼亚等西方盟国怀有敌意。&nbsp;&nbsp;<?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p>&nbsp;</o:p></P>
<P><o:p>本场景还假定坦桑尼亚最近从中国购买了更多飞机和导弹艇。&nbsp; </o:p></P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt">-------------------------------------------------------</P>
<P>本场景创建时，坦桑尼亚使用的中国 025 型（<EM>Huchuan</EM>，即“湖川”级）巡逻艇在 DB3K 中尚不存在。苏联 P-4 与之大致相近，因此被用作替代。&nbsp; </P>
<P>压缩包内附有一个 delta 模板 .ini 文件，用于协助将场景更新至数据库的任何未来版本。&nbsp; </P>
