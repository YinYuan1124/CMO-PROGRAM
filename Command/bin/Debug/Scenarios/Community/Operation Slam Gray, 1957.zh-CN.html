<BODY scroll=auto><P>多米尼加共和国曾多年由残暴的独裁者拉斐尔·特鲁希略（Rafael Trujillo）将军统治。&nbsp; 历史上，特鲁希略于1960年遇刺。&nbsp; </P>
<P>本场景假设暗杀发生在1957年，并在随后的混乱中，一个亲苏政府在多米尼加共和国上台。&nbsp; 新政府立即得到苏联承认，并迅速获得大量军事援助。&nbsp; 美国总统认为这一局势不可容忍。</P>
