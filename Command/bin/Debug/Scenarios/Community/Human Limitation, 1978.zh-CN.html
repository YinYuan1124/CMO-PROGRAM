<BODY scroll=auto><P>冷战时期利比亚与罗得西亚（Rhodesia）的军队形成了鲜明对比。一支在战术层面是能力最强的部队之一，却长期受制于装备匮乏；另一支则是素质低下，却拥有大量装备。</P>
<P>因此，两者在战场上相遇，为检验训练与技能能在多大程度上弥补装备劣势提供了一个绝佳案例。利比亚对非洲的干预已一路南抵赞比亚和罗得西亚，他们正准备跨越赞比西河（Zambezi）发动大规模进攻。</P></BODY>
