<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt; mso-line-height-alt: 5.0pt"><SPAN lang=EN-GB style="FONT-SIZE: 12pt; FONT-FAMILY: 'Times New Roman'; mso-ansi-language: EN-GB; mso-fareast-font-family: 'Times New Roman'">在 8 月格鲁吉亚与俄罗斯开战的最初几天，一支格鲁吉亚机械化纵队试图穿越南奥塞梯，抵达目的地茨欣瓦利（Tshikinvali），在那里增强当地部队的力量并最终占领该镇。其抵达该市将改变力量平衡，并可能意味着俄罗斯的计划遭受严重挫折。<o:p></o:p></SPAN></P>
