<P><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG>“EN GARDE 2013”演习今年在北大西洋水域举行。本次演习的目的是评估一支法国特混舰队对抗另一国家陆上防御的能力。这一次的防御方将是 <?xml:namespace prefix = "st1" ns = "urn:schemas-microsoft-com:office:smarttags" /><st1:place w:st="on"><st1:country-region w:st="on">英国</st1:country-region></st1:place>。<?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></STRONG></SPAN></P>
<P><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG>防御将包括英国皇家空军部队（战斗机、预警资产和加油机）、皇家海军部队和皇家炮兵，此外还有遍布<st1:place w:st="on">全岛</st1:place>的大范围早期预警雷达网。<o:p></o:p></STRONG></SPAN></P>
