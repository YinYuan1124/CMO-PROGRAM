<BODY scroll=auto><P><FONT size=4>1988 年，马来西亚与菲律宾之间曾有一段短暂的紧张时期，起因是有报道错误地称马来西亚吞并了龟岛（Turtle Islands）。&nbsp;龟岛是一组小岛，属于菲律宾，但位于菲律宾与马来西亚海上边界非常近的地方。&nbsp;&nbsp;&nbsp;&nbsp;</FONT></P>
<P><FONT size=4>本场景假定马来西亚确实吞并了这些岛屿，而菲律宾决定以武力夺回它们。&nbsp; </FONT><FONT size=4></P>
