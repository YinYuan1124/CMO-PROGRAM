<BODY scroll=auto><P>台湾回归中国已有数年。&nbsp; 围绕尖阁诸岛（Senkaku Islands）的持续争端不断升级，中俄（轴心）联盟与日本之间最终爆发战争。&nbsp; 美国及其盟国站在日本一边，但中国和俄罗斯的毁灭性打击已重创日本以及美国在西太平洋的主要基地。&nbsp; 轴心国在东海拥有制空权和制海权，正筹备入侵冲绳。&nbsp; 一支轴心国航母打击群已穿过宫古海峡进入西太平洋，以切断冲绳和日本与盟军增援的联系。&nbsp; 一支正驶向该海域的盟军航母打击群受命确保通往日本的海上航道安全。 </P></BODY>
