<BODY scroll=auto><P>1973年10月的赎罪日战争之后，以色列对其安全状况并不满意。埃及不断骚扰以色列船只，关于破坏活动的说法甚嚣尘上。1977年10月，埃及封锁曼德海峡（Bab-el-Mandeb），重新挑起敌对行动。以色列决心恢复其通过红海的航运权利，重创埃及海军，将六艘舰艇送入海底。</P>
<P>如今埃及正考虑封锁蒂朗海峡。从后勤角度看，这似乎是一场唾手可得的胜利：埃及控制着亚喀巴湾的一半，而中立的沙特阿拉伯无论局势如何都拒绝卷入。</P>
<P>蒂朗港是至关重要的后勤节点，它已成为正北方基地的补给通道，且比特拉维夫的港口近得多。确保蒂朗的安全至关重要。</P>
