<BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><P><FONT color=yellow size=4>历史上的科孚海峡事件并不适合改编成一场出色的战争游戏场景。&nbsp;它涉及数艘执行航行自由行动的英国舰艇。&nbsp;两艘英国舰艇被水雷炸伤，四十多名英国水兵丧生。&nbsp;&nbsp;&nbsp;</FONT></P>
<P><FONT color=yellow size=4>本版本假定英国人掌握了更多情报，派出了两艘扫雷舰来清除水雷，并派出一支水面行动群为其提供保护。&nbsp;场景设定在与真实事件大致相同的日期，水面行动群包含了当时涉及的大部分历史舰艇。&nbsp;&nbsp;&nbsp;</FONT></P>
