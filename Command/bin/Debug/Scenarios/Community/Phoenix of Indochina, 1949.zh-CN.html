<BODY scroll=auto><P>日本舰艇“凤翔”号（Hosho）是海军航空兵的重要先驱，是第一艘作为航空母舰建造的军舰。她奇迹般地熬过了第二次世界大战，历史上被改装为运输船，随后拆解。在本想定中，“凤翔”号作为战利品被移交给法国，其新主人在面对印度支那战争时，毫不迟疑地将其投入使用。在这里，“凤翔”号（以保留原意的另一种语言重新命名）如今在海防上空作战</P>
<P>——想定作者 Coiler12。</P></BODY>
