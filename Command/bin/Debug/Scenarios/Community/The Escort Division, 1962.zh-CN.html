<BODY scroll=auto><P>一支由二战旧式护航驱逐舰组成、舰员为匆忙召回的预备役人员的美国海军护航分队，正护送一支补给船队前往与世隔绝的冰岛。</P>
<P>本场景设计为一场轻量级反潜/扫雷任务，灵感来自我的 1962-1963 年版《简氏战舰年鉴》（Jane's Fighting Ships）。我想在一个可信的战后作战环境中操作一些相当冷门的舰艇。 </P>
<P>同时，为获得最大的可重玩性，大多数部队的起始位置都是随机的。</P>
