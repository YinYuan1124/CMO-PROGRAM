<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN><STRONG>日期/时间：</STRONG>&nbsp;2017 年 4 月 20 日</SPAN></P>

<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN><STRONG>可玩方：&nbsp;</STRONG><st1:country-region w:st="on"><st1:place w:st="on">美国</st1:place></st1:country-region></SPAN></P>
<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN><st1:country-region w:st="on"><st1:place w:st="on"></st1:place></st1:country-region></SPAN>&nbsp;</P>
<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><U><STRONG>引言：<?xml:namespace prefix = o ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></STRONG></U></P>
<P class=MsoNormal><FONT color=black>为回应有关可能违反核扩散协议的外交紧张局势，伊朗宣布对在该地区的军事交通实施隔离。我们在该地区的伙伴国家已缩减行动，民用交通也一直遵守伊朗海军的指示。 </FONT></P>
<P class=MsoNormal>你的任务是挑战这一现状，并展示美国海军对国际水域航行自由的承诺。</P>
<P class=MsoNormal><STRONG><U><FONT color=red>想定设计说明：</FONT></U></STRONG></P>
<P class=MsoNormal>这是一个小型海上控制想定，代表了一种可能的力量与目标组合；大致相当于“油轮战争”期间的“祈祷螳螂”行动（Operation Praying Mantis），但规模有所缩小。</P></BODY>
