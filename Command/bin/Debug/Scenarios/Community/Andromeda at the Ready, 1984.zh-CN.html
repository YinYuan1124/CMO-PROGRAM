	<BODY scroll=auto><P>20 世纪 80 年代，伊朗和伊拉克都曾袭击波斯湾的商船，企图切断彼此的贸易。&nbsp; </P>
<P>本场景假设，20 世纪 80 年代曾多次驻防波斯湾的英国护卫舰 <EM>Andromeda</EM>（“仙女座”号）受命保护一艘被伊朗水雷炸伤、并有遭受伊朗军队进一步攻击风险的英国商船。&nbsp; &nbsp; </P>
