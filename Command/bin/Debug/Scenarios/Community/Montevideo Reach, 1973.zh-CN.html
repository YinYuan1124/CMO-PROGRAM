	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY scroll=auto><P>1973 年，乌拉圭的一场政变使一个军政府掌控了国家。&nbsp; 在历史上，该军政府镇压了一切反对派；政变后的十年间，工会和政党均属非法。&nbsp; </P>
<P>本场景假定左翼分子在抵抗政府镇压方面取得了更大成功，最终引发了一场全面叛乱。&nbsp;&nbsp;它还假定苏联决定支持叛军，希望最终在拉丁美洲建立又一个社会主义国家。</P>
