<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN><STRONG>日期/时间：</STRONG>&nbsp;2014 年 5 月 26 日</SPAN></P>
<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN></SPAN><SPAN></SPAN><SPAN><STRONG>地点： </STRONG><?xml:namespace prefix = st1 ns = "urn:schemas-microsoft-com:office:smarttags" /><st1:place w:st="on">乌克兰东部</st1:place></SPAN></P>
<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN><st1:place w:st="on"></st1:place></SPAN><SPAN><STRONG>可玩方：&nbsp;</STRONG>乌克兰空军<st1:country-region w:st="on"><st1:place w:st="on"></st1:place></st1:country-region></SPAN></P>
<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN><st1:country-region w:st="on"><st1:place w:st="on"></st1:place></st1:country-region></SPAN>&nbsp;</P>
<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN><st1:country-region w:st="on"><st1:place w:st="on"></st1:place></st1:country-region></SPAN></SPAN><SPAN style="WIDOWS: 1; TEXT-TRANSFORM: none; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; DISPLAY: inline !important; FONT: 14px/22px sans-serif; WHITE-SPACE: normal; FLOAT: none; LETTER-SPACING: normal; COLOR: rgb(37,37,37); WORD-SPACING: 0px; -webkit-text-stroke-width: 0px">2014 年 4 月初，乌克兰政府开始在顿涅茨克州对亲俄叛乱分子展开反恐行动。与“顿涅茨克人民共和国”（DPR）有关联的亲俄抗议者和叛乱分子</SPAN><SPAN style="WIDOWS: 1; TEXT-TRANSFORM: none; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; DISPLAY: inline !important; FONT: 14px/22px sans-serif; WHITE-SPACE: normal; FLOAT: none; LETTER-SPACING: normal; COLOR: rgb(37,37,37); WORD-SPACING: 0px; -webkit-text-stroke-width: 0px"><SPAN class=Apple-converted-space>&nbsp;</SPAN>占领了该地区的众多政府建筑、城镇和领土。在顿涅茨克</SPAN><SPAN style="WIDOWS: 1; TEXT-TRANSFORM: none; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; DISPLAY: inline !important; FONT: 14px/22px sans-serif; WHITE-SPACE: normal; FLOAT: none; LETTER-SPACING: normal; COLOR: rgb(37,37,37); WORD-SPACING: 0px; -webkit-text-stroke-width: 0px"><SPAN class=Apple-converted-space>&nbsp;</SPAN>市本身，许多政府建筑处于分离主义分子控制之下。机场<SPAN class=Apple-converted-space>&nbsp;</SPAN></SPAN><SPAN style="WIDOWS: 1; TEXT-TRANSFORM: none; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; DISPLAY: inline !important; FONT: 14px/22px sans-serif; WHITE-SPACE: normal; FLOAT: none; LETTER-SPACING: normal; COLOR: rgb(37,37,37); WORD-SPACING: 0px; -webkit-text-stroke-width: 0px">仍处于叛乱分子控制之外。</SPAN></P>
<P style="MARGIN: 0cm 0cm 0pt" class=MsoNormal><SPAN style="WIDOWS: 1; TEXT-TRANSFORM: none; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; DISPLAY: inline !important; FONT: 14px/22px sans-serif; WHITE-SPACE: normal; FLOAT: none; LETTER-SPACING: normal; COLOR: rgb(37,37,37); WORD-SPACING: 0px; -webkit-text-stroke-width: 0px"></SPAN>&nbsp;</P>
