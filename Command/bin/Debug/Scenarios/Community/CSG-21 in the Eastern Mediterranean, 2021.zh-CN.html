<BODY scroll=auto><P>CSG-21 逼近叙利亚海岸，其舰载机预计将执行一代人以来英国航母的首次实战出击。</P>
<P>由于 CSG-21 的部署，尤其是上周 <EM>HMS Defender</EM> 号和 <EM>HNLMS Evertsen</EM> 号在黑海进行航行自由行动时发生的事件，与俄罗斯的紧张关系再度升温。由于所受到的骚扰，以及打击群在苏达海军基地补给期间俄罗斯在东地中海集结兵力，国防部已决定集中其兵力。打击群的所有水面舰艇将集结会合，同时航空联队开始对 ISIS 采取行动。</P></BODY>
