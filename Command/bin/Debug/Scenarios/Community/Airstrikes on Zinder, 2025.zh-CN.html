<BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><P><FONT color=black size=4>本剧本假定在不久的将来尼日尔将经历一场内战。&nbsp; 一个名为 ZLA 的组织试图在尼日尔的津德尔地区建立一个独立国家。&nbsp; 该组织已占领该地区最大的城市——同样名为津德尔，目前正作为一个事实上的国家运作。</FONT></P>
<P><FONT color=black size=4>西非国家经济共同体（ECOWAS）有时会组织多国维和行动。&nbsp; 它已组建一个联盟，帮助尼日尔打击叛军。</FONT><FONT color=black size=4></P>
