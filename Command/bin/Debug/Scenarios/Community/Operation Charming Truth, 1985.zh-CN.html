<BODY scroll=auto><P>本场景假定 1985 年苏丹发生的一场政变导致该国陷入大范围的混乱与暴力。苏丹政府认为一些美国平民正在组织反政府抗议。美国已决定从苏丹撤离美国人。</P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt">-------------------------------------------------------</P>
<P>压缩包内附有一个 delta 模板 .ini 文件，用于协助将场景更新至数据库的任何未来版本。</P>
<P>苏丹的巡逻艇（原为一艘伊朗巡逻艇）不在当前的 DB3000 中。它是以另一艘尺寸和速度大致相同的伊朗巡逻艇为原型，通过修改其传感器和武器来建模的。</P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt">场景作者：Mark Gellis</P>
