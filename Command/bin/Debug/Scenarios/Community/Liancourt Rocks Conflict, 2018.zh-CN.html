<BODY scroll=auto><P>日本对韩国 </P>
<P>日期：2018年8月1日</P>
<P>地点：日本海</P>
<P>可扮演方：日本</P>
<P>&nbsp;</P>
<P><STRONG><U>引言</U></STRONG></P>
<P>日本与韩国多年来一直对利扬库尔岩（Liancourt Rocks）的领土权存在争议。2018年8月，韩国政府突然宣布韩国拥有这些岛屿，并开始扩建军事设施。<BR>此举激怒了日本政府，两国之间的紧张关系随之升级。日本政府下令立即占领利扬库尔岩，两国随即展开军事行动。</P>
<P>然而，联合国安理会已开始在两​​国之间进行调解，因此军事行动仅被允许持续24小时。</P>
