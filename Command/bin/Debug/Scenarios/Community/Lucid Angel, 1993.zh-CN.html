<BODY scroll=auto><P>1992年夏，阿尔及利亚总统穆罕默德·布迪亚夫（Mohamed Boudiaf）遇刺身亡。&nbsp; 一个由军方支持的过渡政府上台执政，并宣布进入紧急状态。&nbsp; 数千人遭到逮捕；据多个人权组织称，政府普遍使用酷刑。&nbsp; </P>
<P>本剧本假定，在被捕者中有数名美国人。</P>
<P>剧本作者：Mark Gellis。</P>
