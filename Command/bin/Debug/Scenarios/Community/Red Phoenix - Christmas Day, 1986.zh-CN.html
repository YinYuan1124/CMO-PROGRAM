<BODY scroll=auto><P>"‘长官，我是作战部的 Luther。&nbsp; 我们接到全面召回令。&nbsp; 这不是演习。’&nbsp; ‘最好他妈的别在平安夜搞这一套。’&nbsp; 随后 Tony 意识到那意味着什么。" </P>
<P>朝鲜人决定以武力完成朝鲜半岛的统一。&nbsp; 群山空军基地（Kunsan AFB）已遭到快速战机——米格-23（Mig-23）——的打击并受损。&nbsp; 主攻空袭仅剩几分钟之遥。&nbsp; 让你的 F-16 升空，保卫你的空军基地！</P>
<P>&nbsp;</P>
<P>作者注：这是一个极短（但极度狂暴）的场景。&nbsp; 它应当需要密集的微操，所以不要到处创建任务然后看着导弹乱飞（或者也可以，随你便）。</P></BODY>
