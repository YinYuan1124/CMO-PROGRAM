<BODY scroll=auto><P>第三次世界大战期间，印度洋对苏联部队而言本应是一个困难的战区。 </P>
<P>他们唯一的海外前哨——也门的索科特拉岛（Socotra）——远离苏联基地，补给线脆弱。这些部队本就不被指望能在战争中幸存。他们的任务是在覆灭之前尽可能久地牵制北约部队，并消耗其敌人。</P>
<P>切断来自波斯湾的石油流动是另一项目标，但这同样问题重重。击沉中立油轮只会把更多国家拉入冲突、站到北约一边。</P>
<P>本剧本改编自 Michael A. Palmer 的著作<U>《从未发生的战争》（The War That Never Was）</U>，记述了苏联部队在印度洋的覆灭。他们能拉多少北约单位同归于尽？</P></BODY>
