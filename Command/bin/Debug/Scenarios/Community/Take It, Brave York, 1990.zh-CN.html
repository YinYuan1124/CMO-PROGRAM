<BODY scroll=auto><P>本想想定假设 1990 年冬天苏联与北约之间的紧张关系加剧。濒临崩溃的苏联担心北约正在策划某种侵略行动，甚至可能是一场斩首式核打击。这一时期，苏联海军舰艇和潜艇的出航次数增加，试图收集情报，并把军事资产部署到一旦开战最能发挥作用的位置。这自然加剧了北约方面的担忧，认为苏联可能正在策划某种攻击。</P>
<P>标题取自威廉·莎士比亚（William Shakespeare）的《亨利五世》（<EM>Henry V</EM>）。亨利是在回应约克公爵请求率领英军前锋参加阿金库尔战役（Agincourt），这一决定最终导致公爵阵亡。</P>
<P>想定作者：Mark Gellis</P>
