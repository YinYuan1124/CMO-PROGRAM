<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p>&nbsp;</o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN><STRONG>日期/时间：&nbsp;</STRONG>1964年8月2日 / 16:00:00 当地时间</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG>地点：</STRONG>北部湾（东京湾）</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG>可扮演方：</STRONG>美国、北越</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">驱逐舰 USS Maddox（DD-731，马多克斯号）正在北部湾执行侦察任务，位于靠近北越海岸的国际水域；该驱逐舰在湾内航行数日后正在返航，此前它执行了一项秘密的电子战支援措施任务（代号 DESOTO）。</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
