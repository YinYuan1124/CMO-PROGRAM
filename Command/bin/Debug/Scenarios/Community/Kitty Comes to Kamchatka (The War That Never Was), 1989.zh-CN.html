	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY scroll=auto><P>彼得罗巴甫洛夫斯克（Petropavlovsk）是俄罗斯唯一直接面向太平洋的大型海军基地。这一事实，加上其邻近阿拉斯加，使其在冷战期间成为北约的首要目标。</P>
<P>本场景改编自 Michael A. Palmer 所著《那场从未发生的战争》（<U>The War That Never Was</U>），考察以“小鹰”号（USS Kitty Hawk）为核心的单支航母特混舰队攻击并瘫痪这一重要设施的能力。</P>
<P>本场景是一个直接的空中作战场景。其中不包含反潜战，因此省略了所有反潜兵力。</P>
<P>苏联防空体系按照一体化防空系统（IADS）建模。玩家最好先寻找弱点加以攻击。同时要当心天气对你传感器和武器的影响。</P></BODY></html>
