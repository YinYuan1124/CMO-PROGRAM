<BODY scroll=auto><P><STRONG><U><EM>Convoy '88 </EM></U></STRONG></P>
<P><IMG style="HEIGHT: 302px; WIDTH: 365px" alt=http://www.navsource.org/archives/05/pix2/05011881.jpg src="http://www.navsource.org/archives/05/pix2/05011881.jpg" width=674 height=451></P>
<P>背景——本场景设定于1988年5月，即假设的北约与华约在欧洲爆发冲突后的第五天。&nbsp;如果冷战升级为真枪实弹的战争，北大西洋的控制权对双方而言都至关重要。对北约来说，目标是保持海上航道畅通，保护驶往欧洲的护航船队免遭苏联潜艇和轰炸机的攻击。苏联的首要目标则是封锁大西洋，切断北约的海上补给。 </P>
<P>《Convoy '88》让玩家在24小时内担任88-7护航船队司令。这主要是一个反潜场景，不过其中也包含相当可观的空中威胁。&nbsp;&nbsp;</P>
