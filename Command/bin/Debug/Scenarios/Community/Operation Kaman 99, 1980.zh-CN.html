<BODY scroll=auto><P><U>序幕：</U></P>
<P>1980 年 9 月 22 日，伊拉克对伊朗的战略要地发动大规模空袭。<BR>当地时间下午 1:45，6 架伊拉克 MiG-23 Flogger（鞭挞者）轰炸了阿瓦士附近的一座伊朗空军基地。<BR>半小时后，伊拉克 MiG-23 攻击了德黑兰的梅赫拉巴德机场。与此同时，伊拉克人还轰炸了伊朗另外 8 座主要空军基地。<BR>然而，伊朗吸取了六日战争的教训，修建了混凝土机堡，存放了大部分作战飞机，因此伊拉克人主要只是炸出了几个伊朗跑道的弹坑，并未对伊朗空军造成任何重大损失。此时，伊朗空军开始准备次日发动的反击。</P></BODY>
