<BODY scroll=auto><P>地理对苏联和华约并不友善。</P>
<P>俄罗斯、波兰和东德在波罗的海的港口，被丹麦这个国家阻断了通往北海及更远港口的通道。丹麦群岛构成了“软木塞”，将华约部队封在波罗的海这个“瓶子”里。</P>
<P>本场景试图再现迈克尔·A·帕尔默（Michael A. Palmer）的小说 <U>The War That Never Was</U> 中的“科德尔海峡之战”。华约部队的任务是充当“开塞钻”，在哥本哈根（Copenhagen）附近强行实施两栖登陆。为此，他们必须克服空中、水面和水下（包括水雷）力量。 </P>
<P>预计战斗将近距离、快速且致命。</P></BODY>
