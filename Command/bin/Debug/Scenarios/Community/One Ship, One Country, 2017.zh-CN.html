<body scroll=auto><P>在这场兵棋推演中，F-35 与作为轻型航母的 LHA 的能力将受到检验：一艘两栖舰被迅速调转方向，去攻击一个由技艺高超的“入侵者”（Aggressors）组成的虚构国家。</P>
<P>对许多新训练的飞行员来说，这将是他们的第一场大“战”。假想的 AEW-Osprey 与 Lightning II 一同出现在本想定中。对指挥官而言，这也将是一场大战——如何应对有限弹药的“配给”与众多目标。</P></body>
