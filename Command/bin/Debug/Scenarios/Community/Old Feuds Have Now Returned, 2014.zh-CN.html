<body scroll=auto><P>时间线发生了分歧，苏格兰人没有投票支持统一，而是投票支持独立。这由许多因素造成——在这条时间线上，公投举行得更早，对威斯敏斯特削减开支的记忆更为鲜明，再加上油价飙升，使苏格兰民族党（SNP）的政纲显得更加现实。 </P>
<P>苏格兰刚一投票支持独立，麻烦就开始了。油价上涨只是幻象，是阿曼-巴基斯坦战争后的恐慌情绪所驱动的短暂现象，并非供需发生了任何实质性变化。混乱而灾难性的分裂之后，两国都陷入衰退。亲英的设得兰群岛举行了属于自己的公投，而由于海上边界决定谁能控制资源，这就成了一个问题。 </P>
<P>军舰被派出，第一枪打响，英格兰人与苏格兰人之间的战争又回来了。 </P>
<P>-想定作者：Coiler12</P></body>
