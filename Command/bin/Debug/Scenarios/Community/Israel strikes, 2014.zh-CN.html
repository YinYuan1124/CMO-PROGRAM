	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY scroll=auto><P>打击的时刻已经到来。&nbsp; 伊朗已研制出射程足以打击以色列的弹道导弹，并将其部署在新建的加固设施中。&nbsp; 目前尚不清楚他们何时能够研制出核弹头。&nbsp; 不能冒任何风险。&nbsp; 你的首要目标是摧毁加固发射井，次要目标是摧毁其核反应堆，最后是任何浓缩设施。&nbsp; 这次行动旨在进行一次快速有限的打击，消除其打击以色列的能力，而非挑起一场持久战争。&nbsp; 一旦你进入其领空，他们就会紧急起飞战斗机，因此务必让第一波攻击发挥最大效果。&nbsp; 祝你好运！</P>
<P>&nbsp;</P>
<P>得分</P>
<P>20 - 导弹发射井</P>
<P>15 - 核反应堆</P>
<P>10 - 机动导弹部队、核浓缩设施（大型建筑）。</P></BODY></html>
