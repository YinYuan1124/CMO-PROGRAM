<BODY scroll=auto><P><FONT size=4>苏联发动了突然袭击。他们占领了博恩霍尔姆（Bornholm），其空军目前正在攻击西兰岛（Zealand）。迄今为止，此次攻势未涉及大型海军水面战斗舰艇。预计德国北部所有军事基地将遭到猛烈空袭。</FONT></P>
<P><FONT size=4>德国在波罗的海的舰队必须从海军基地转移到丹麦群岛以北卡特加特海峡（Kattegat）的指定 CSP。</FONT></P>
<P><FONT size=4>你的任务是将舰船从港口经可能的雷区撤离，并保护它们免受空袭和潜艇攻击。</FONT></P>
