<BODY scroll=auto><P><FONT size=4>本剧本假定严重的国内动乱和恐怖主义持续困扰菲律宾。菲律宾已向其最亲密的盟友之一美国求助，协助其追剿盘踞在薄荷岛（Bohol Island）的恐怖分子。</FONT><FONT size=4></P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt"><SPAN style="FONT-SIZE: 14pt">-------------------------------------------------------<?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></SPAN></P>
<P><SPAN style="FONT-SIZE: 14pt">本剧本利用了《Command》编辑单个单位的能力。&nbsp; 例如，六个海豹突击队（SEAL）小队已针对其预期面对的敌人进行了定制，以最大限度地发挥效能。</SPAN></P>
<P><SPAN style="FONT-SIZE: 14pt">压缩包中附带了一个 delta 模板 .ini 文件，以便在数据库未来版本发布时更新本剧本。&nbsp; <o:p></o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt"><SPAN style="FONT-SIZE: 14pt">剧本作者：Mark Gellis<o:p></o:p></SPAN></P>
