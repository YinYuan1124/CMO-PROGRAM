<P class=MsoNormal style="MARGIN: 0cm 0cm 8pt">印度尼西亚陷入内战，面对的是苏门答腊东北部的分离主义叛军——后者正从国外获得广泛支持——对抗官方政府。为切断外国援助，印尼海军开始登临检查一些途经马六甲海峡及苏门答腊西海岸、可能向叛军提供帮助的商船。往返新加坡港的船只不止一次遭到骚扰，引起相当大的担忧和紧张。几天后，新加坡海军开始沿其交通线巡逻，以确保航行自由。下次印尼巡逻艇再拦截检查友好商船时，希望新加坡海军能就位，进行一场武力展示。</P>
