	<body scroll=auto><P>1976 年，布隆迪发生政变。本场景假定政变导致该国陷入大规模动乱，叛乱团体夺取了军事装备的控制权。随着平民伤亡危险不断上升，一支由法国和英国领导的国际联盟已部署到位，准备采取行动。</P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt">-------------------------------------------------------</P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt">&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt">本场景聚焦于英军针对控制布隆迪北部城镇的叛乱分子所采取的行动。未来的场景可能会涉及法国及其他国家在这场虚构冲突中的行动。</P>
<P>.zip 文件中附带了 delta 模板 .ini 文件，用于协助将本场景更新至任何未来版本的数据库。&nbsp; </P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt">场景作者：Mark Gellis</P>
