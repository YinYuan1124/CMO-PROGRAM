	<body text=#dcdcdc bgColor=#2b2b2b scroll=auto><P><FONT size=4><STRONG>日期/时间： </STRONG>05-10-2024 / 13:00:00 祖鲁时间<BR><STRONG>地点： </STRONG>冲绳</FONT></P>
<P><FONT color=yellow size=6><STRONG>引言</STRONG></FONT></P>
<P><FONT size=4>中国的突然袭击打击了东北亚的每一个美国盟友。日本和韩国的主要军事设施在中国弹道导弹打击下遭受重创，中国军队已攻占日本冲绳群岛并取得控制权。 </FONT></P>
<P><FONT size=4>尽管美国及其盟友遭受重大损失，但他们仍远未被击败……</FONT></P>
<P><STRONG><FONT color=yellow size=6>场景说明：</FONT></STRONG></P>
<P><FONT size=4>这是一个中等规模、单方视角的战役场景，时长为 2 天。您拥有两个美国航母打击群，主要配备三种反舰武器：AARGM、LRASM 和多任务型 Tomahawk（“战斧”）。 </FONT><FONT size=4>您的主要目标是在冲绳附近的中国航母“山东”号。</FONT></P></body>
