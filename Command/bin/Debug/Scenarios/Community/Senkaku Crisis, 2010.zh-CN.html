<body scroll=auto><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG><FONT size=4>日本对中国</FONT></STRONG></SPAN>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><B style="mso-bidi-font-weight: normal"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">日期：</SPAN></B><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"> 2010年9月7日</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN><B style="mso-bidi-font-weight: normal"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">地点：</SPAN></B><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"> 冲绳，<?xml:namespace prefix = "st1" ns = "urn:schemas-microsoft-com:office:smarttags" /><st1:place w:st="on"><st1:PlaceName w:st="on">东</st1:PlaceName><st1:PlaceType w:st="on">海</st1:PlaceType></st1:place></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><B style="mso-bidi-font-weight: normal"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">可玩阵营</SPAN></B><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">：日本</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG><U>简介</U></STRONG></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG><U></U></STRONG></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">一艘在有争议水域作业的中国拖网渔船在尖阁诸岛附近与日本海上保安厅巡逻艇相撞。日本政府下令扣押该拖网渔船及其船员。此</SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">举严重激怒了中国政府，两国之间的紧张关系随之加剧。</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">然而，联合国安理会已开始在两国之间进行调解，因此军事行动仅允许持续 12 小时。</SPAN></P></body>
