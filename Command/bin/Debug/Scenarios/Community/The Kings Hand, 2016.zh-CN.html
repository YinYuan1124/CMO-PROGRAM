<BODY scroll=auto><P><FONT face="Microsoft Sans Serif">沙特阿拉伯国王 <SPAN style="WHITE-SPACE: normal; WORD-SPACING: 0px; TEXT-TRANSFORM: none; FLOAT: none; COLOR: rgb(0,0,0); FONT: medium Arial; WIDOWS: 1; DISPLAY: inline !important; LETTER-SPACING: normal; TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px"><FONT size=3>穆罕默德·本·萨勒曼（Muhammad bin Salman）遭埃及特种部队暗杀，使这两个关系摇摇欲坠的国家陷入绝境。&nbsp;&nbsp;一项代号“国王之手”（The King's Hand）的秘密军事计划随之启动，其内容是突袭法伊德（Fayed）的一座空军基地，以及负责此次暗杀的埃及军事部队驻地。但一些顾问担心，由于开罗的军事集结已酝酿数月，该计划杯水车薪、为时已晚。 </FONT></SPAN></FONT></P>
<P><FONT face="Microsoft Sans Serif"><SPAN style="WHITE-SPACE: normal; WORD-SPACING: 0px; TEXT-TRANSFORM: none; FLOAT: none; COLOR: rgb(0,0,0); FONT: medium Arial; WIDOWS: 1; DISPLAY: inline !important; LETTER-SPACING: normal; TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px"><FONT size=3>你能击败一个在空中优势上拥有 2 比 1 优势的对手吗？</FONT></SPAN></FONT></P></BODY>
