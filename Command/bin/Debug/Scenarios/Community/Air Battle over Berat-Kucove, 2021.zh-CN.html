<BODY scroll=auto><P>本剧本假定2020年阿尔巴尼亚爆发内战。&nbsp; 经过数月激战，双方陷入不稳定的停火状态。&nbsp; 然而，北阿尔巴尼亚利用战斗间歇与塞尔维亚和俄罗斯谈判军火交易。&nbsp; 由于担忧战争走向及其对该地区的影响，希腊向阿尔巴尼亚南部出售了一批较旧的 Mirage（幻影）战斗机和其他军事装备。&nbsp; </P>
