<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p>&nbsp;</o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN><STRONG>日期/时间：</STRONG>1977 年 11 月 25 日 / 22:00:00 Zulu<o:p></o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><STRONG><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">地点：</SPAN></STRONG></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG>可玩方：</STRONG>阿根廷</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">
<P><B>Journeyman（熟练工）行动</B>是皇家海军的一次行动，派遣一支海军编队（包括 1 艘核潜艇、2 艘护卫舰和 2 艘辅助舰船）前往南大西洋，以回应南图勒岛上建立一座驻有 50 名科学家的基地之举。后来阿根廷人在图勒岛上建立了一座军事基地。</P>
<P>该行动最终通过外交手段得以制止。</P>
<P>如果皇家海军奉命攻击阿根廷基地，会怎样？</P>
<P>作者：Miguel Molina 'Meroka37'</P>
