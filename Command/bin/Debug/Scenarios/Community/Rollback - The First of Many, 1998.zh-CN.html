<BODY scroll=auto><P>-自1991年海湾战争伊拉克战败以来，它一直是美国的麻烦。彻底击败萨达姆的想法一直在权力走廊中私下流传。关于如何在不经历又一次直接入侵和占领的困难的情况下实现这一目标，争论激烈，而伊拉克流亡者承诺，他们确实能组建一支足以击败他们眼中的“纸老虎”的部队。 </P>
<P>-随后与地区伙伴进行了极其紧张和艰难的谈判。由于许多传统盟友对该计划持怀疑态度，美国已转向更不可能（也不光彩）的伙伴。但就在外交官们谈判之际，军方已经以违反禁飞区和标准挑衅为借口，开始发动后来被称为“逆转战略”（Rollback Strategy）的最初打击。</P>
<P>-在波斯湾的两艘航母上，最新、最先进的海军飞机正准备执行决定性的打击……</P></BODY>
