<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="FONT-SIZE: 10pt; mso-bidi-font-size: 12.0pt"><STRONG>2020年春季</STRONG></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="FONT-SIZE: 10pt; mso-bidi-font-size: 12.0pt"></SPAN><FONT size=2>&nbsp;</FONT></P><SPAN lang=EN-GB style="FONT-SIZE: 10pt; mso-bidi-font-size: 12.0pt">
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt; mso-pagination: widow-orphan; mso-hyphenate: auto"><SPAN lang=EN-US style="mso-ansi-language: EN-US"><FONT size=3>在印度洋与中国和巴基斯坦海军发生冲突后，印度向巴基斯坦主要港口卡拉奇前方派遣了一支特遣舰队，以阻止来自东方及穆斯林盟友的任何增援和补给。印度空中战役摧毁了巴基斯坦东南部大部分防空导弹和敌机，但如今印度空军和海军最先进的部队已被调往东部战线，以应对中国的威胁。巴基斯坦海军和空军的任务是解除敌军在其主要港口前方的封锁。</FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt; mso-pagination: widow-orphan; mso-hyphenate: auto"><SPAN lang=EN-US style="mso-ansi-language: EN-US"><FONT size=3><?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></FONT></SPAN>&nbsp;</P>
