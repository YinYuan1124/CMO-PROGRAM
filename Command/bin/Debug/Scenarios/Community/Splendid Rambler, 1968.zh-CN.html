<BODY scroll=auto><P>本场景假定20世纪60年代末澳大利亚与印度尼西亚之间的紧张关系加剧。&nbsp; 到1968年，局势变得更加严重，印度尼西亚海军舰艇以涉嫌侵犯其领海为由骚扰澳大利亚渔船和商船。&nbsp; 1968年2月下旬，印度尼西亚向一艘澳大利亚渔船鸣枪警告，损坏了该船并打伤两名澳大利亚渔民。&nbsp; </P>
