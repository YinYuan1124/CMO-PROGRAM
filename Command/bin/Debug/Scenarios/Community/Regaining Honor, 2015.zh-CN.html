<BODY scroll=auto><P>2015年4月2日：</P>
<P>中东的动荡导致也门政府发生更迭。随着多个政权接连垮台以及对伊斯兰主义者全面接管的担忧，一个由除最极端党派外所有派别组成的民族团结政府已经成立。不幸的是，这个民族团结政府中混杂着“温和派”和旧日的反西方社会主义者，也门总统和总理面临着来自内部和外部的政治压力。</P>
<P>与此同时，也门国内的不稳定促使美国在邻近的吉布提部署越来越多的部队和装备，并大幅增加无人机活动。几起附带损伤事件以及无人机的持续存在激怒了也门公众和政界人士。 </P>
<P>面对这种压力，也门国防部长提议进行一次有限的武力展示，以“恢复国家的荣誉”……</P></BODY>
