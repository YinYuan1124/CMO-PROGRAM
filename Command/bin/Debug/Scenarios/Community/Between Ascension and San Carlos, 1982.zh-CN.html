<P><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">按南美标准，阿根廷海军相当强大，但从未试图攻击英国在 <st1:PlaceName w:st="on">阿森松</st1:PlaceName> <st1:PlaceType w:st="on">群岛</st1:PlaceType> 与 <st1:place w:st="on">福克兰群岛</st1:place> 之间的大西洋交通线。本场景描绘一支咄咄逼人的阿根廷远洋海军编队试图攻击有护航的皇家海军补给舰，这些舰船正为南方的英国特遣舰队运送急需的燃料和备件。 <o:p></o:p></SPAN></P></BODY>
