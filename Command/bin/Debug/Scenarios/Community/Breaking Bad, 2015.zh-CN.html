		<P>事态出现惊人转折：中央情报局（CIA）已证实，伊朗转而效忠阿拉伯半岛基地组织（AQAP），并向该恐怖组织提供资金、武器和训练。随着伊朗试图对美国发动代理人战争并夺取曼德海峡（Bab al-Mandab Strait）和红海的控制权，也门内战可能进一步恶化。美国总统不顾文职顾问的意愿，选择信任其军事顾问，并开始向也门派遣地面部队。</P>
