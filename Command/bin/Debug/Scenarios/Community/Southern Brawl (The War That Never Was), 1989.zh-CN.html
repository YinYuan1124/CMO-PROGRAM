<BODY scroll=auto><P>1989年7月15日</P>
<P>第三次世界大战爆发已一天，希腊和土耳其已在苏联、保加利亚和罗马尼亚的压力下开始崩溃。&nbsp; 希腊北部和博斯普鲁斯海峡上空的制空权已拱手让给华约部队，它们在后撤的希腊和土耳其军队上方肆意活动。&nbsp; 新的一天带来新的希望，也带来对华约部队今日行动的恐惧。&nbsp; 土耳其和希腊空军只有一项任务：阻止华约的空中攻势，否则就战死！</P>
<P>&nbsp;</P>
<P>本场景大致改编自 Michael A. Palmer 所著的<U>《从未发生的战争》</U>（The War That Never Was）。</P></BODY>
