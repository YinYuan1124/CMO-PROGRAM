<P><FONT color=#0b0080 face=Arial><U></U></FONT></P><FONT color=#0b0080 face=Arial></FONT><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">
<P><B style="mso-bidi-font-weight: normal"><SPAN lang=EN-US style="mso-ansi-language: EN-US">场景：</SPAN></B><SPAN lang=EN-US style="mso-ansi-language: EN-US"> </SPAN><STRONG><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">&nbsp;阿森松与圣卡洛斯之间</SPAN></STRONG><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></SPAN></P>
<P><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">福克兰战争，1982年——“假如”场景。<o:p></o:p></SPAN></P>
<P><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">按南美标准，阿根廷海军相当强大，但从未试图攻击英国在 <?xml:namespace prefix = "u1" /><u1:PlaceName u2:st="on">阿森松</u1:PlaceName> <u1:PlaceType u2:st="on">群岛</u1:PlaceType> 与 <u1:place u2:st="on">福克兰群岛</u1:place> 之间的大西洋交通线。本场景描绘阿根廷特遣舰队（包括 Venticinco de Mayo 号航母）采取进攻行动，试图攻击有护航的皇家海军补给舰——这些舰船正为南方的英国特遣舰队运送急需的燃料和备件。皇家海军发现该计划后，从南方调来 Invincible（“无敌”号）航母及其护航舰艇和一艘核潜艇（SSN）前来支援，力图阻止阿根廷编队并拯救补给舰。</SPAN></P>
<P><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><EM>仅可扮演英国一方</EM></SPAN></P>
<P></SPAN>&nbsp;</P></BODY>
