<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN><FONT face="Times New Roman"><STRONG>日期/时间：</STRONG>1989年9月4日 / 05:45:00 祖鲁时间<o:p></o:p></FONT></SPAN></P>

<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN></SPAN><SPAN></SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><o:p><FONT face="Times New Roman">&nbsp;</FONT></o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG><U><FONT face="Times New Roman">背景</FONT></U></STRONG></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG><U></U></STRONG></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt">凯夫拉维克（Keflavik）上空的战斗异常激烈，目前由北约坚守的机场残余部分已无法使用。&nbsp; 与此同时，欧洲的战事对可用资源提出了巨大需求，使双方都无法派出远程飞机进攻或防御冰岛。&nbsp; 因此，冰岛的命运将由一场决定性的水面战斗来决定。&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt">&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><FONT face="Times New Roman">这是一个反潜/反水面战剧本，持续两天。</FONT></SPAN></P></BODY>
