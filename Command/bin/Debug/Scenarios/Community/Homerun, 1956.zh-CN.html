<BODY scroll=auto><P>自 1952 年起，B-47“同温层喷气”（Stratojet）的侦察改型开始飞越苏联北部，执行照相侦察与电子情报（ELINT）任务。</P>
<P>这些白昼照相侦察任务最初旨在记录苏联防空系统、基地、雷达站及其他可能成为战略空军司令部（SAC）潜在目标的设施的演变情况。</P>
<P>最初几年，RB-47 可以执行照相侦察任务而不必担心被苏联早期的 MiG 战斗机拦截；但很快，其他更快、更先进的喷气式战斗机开始出现，使 SAC 侦察飞行员的任务变得复杂。</P>
<P>本剧本试图再现这些飞行开始变得更具挑战性的那个时期。</P></BODY>
