<P>地点：巴伦支海</P>
<P>时间：1986年10月13日—16日</P>
<P>&nbsp;</P>
<P>对蓝方玩家而言，本剧本相当直接。这是一场持续三天的大规模反潜战役。目标是阻止三艘苏联弹道导弹核潜艇抵达冰层区。你指挥两艘攻击潜艇和9架 P-3B 执行这一任务。如何运用它们由你决定。换句话说，你将掌握自己的命运。交战规则、巡逻扇区、任务参数、战术等等，全部由你确定。游戏开始时你的部队已经展开，但在剧本开始前尚未向其下达任何命令。为方便起见，蓝方代表美国和北约，红方代表苏联。</P>
<P>作为蓝方玩家，可以说你只能自行其是。巡逻区域、交战规则、航向、航速、武器参数等等全由你决定。 </P>
<P>&nbsp;&nbsp;</P></BODY>
