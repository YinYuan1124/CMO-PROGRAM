<BODY scroll=auto><P>注意：本想想定包含飞机损伤机制，因此需要启用“战争链条”（Chains of War）才能正常运行。</P>
<P>在一场激烈的预算之争后，F/A-18 如今让位于重获新生的 Tomcat。随着新型 Super Tomcat 产量逐步提升，美国海军陆战队（USMC）获得了适度升级的海军型战机，以替换其 A-6。来得正是时候，因为它们即将被召唤出战。</P>
<P>菲律宾一场半途而废的政变，导致多个政治派系为争夺控制权而血腥混战的骇人局面。美国试图加以阻止和干预，而其最近的飞机驻扎在冲绳。Super Tomcat 刚一登场，就将接受战火的洗礼。 </P></BODY>
