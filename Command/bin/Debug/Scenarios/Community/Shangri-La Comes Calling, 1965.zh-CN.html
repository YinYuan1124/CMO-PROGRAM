<body scroll=auto><P>本想定假设在 1960 年代中期，埃及与美国之间的紧张关系急剧升级。&nbsp; 由于埃及威胁东地中海的航运，美国决定采取行动。&nbsp; 总统认定，对一座埃及空军基地实施空袭，将是展示美国火力和美国决心的恰当方式。</P>
