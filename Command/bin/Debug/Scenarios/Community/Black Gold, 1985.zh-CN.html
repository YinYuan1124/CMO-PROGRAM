<P>本虚构场景将1987年的“Sismik 事件”推进一步：土耳其石油平台在爱琴海投入使用，为两国之间的一场决定性武装冲突埋下伏笔。</P>
<P><FONT size=5><STRONG><U></U></STRONG></FONT>&nbsp;</P>
<P><FONT size=5><STRONG><U>背景</U></STRONG></FONT></P>
<P>土耳其与希腊之间的紧张关系在爱琴海再次高涨。今年早些时候，土耳其地质学家在希腊阿伊奥斯·埃夫斯特拉蒂奥斯岛（Agios Efstratios）以南发现了一处油田，相关油井已在过去48小时内投产。</P>
<P>雅典方面声称，根据《国际海洋法》的界定，该油田完全位于其领海之内，任何开始钻探作业的钻井平台都将被摧毁。 </P>
<P>希腊&nbsp;已向该地区部署了数艘军舰，并在雅典使多个航空联队进入战备状态。土耳其严重装备不足，正艰难地集结兵力来保护价值数十亿美元的石油平台。</P></BODY>
