<BODY scroll=auto><P>这场假想的未来战争描绘了东南亚遭受自越南战争以来最大规模轰炸的情景。</P>
<P>第二次中越战争，又称“亚洲大战”，其标志是解放军空军发动了自“后卫”行动（Operation Linebacker）以来亚洲大陆规模最大的空中战役。在此战役过程中，中国动用其羽翼未丰的航母力量，前往其陆基航空兵不便抵达的地点——柬埔寨。你将指挥“辽宁”号（Liaoning）打击群攻击越南的附庸国。</P>
<P>这是中国首次将航母投入实战。</P></BODY>
