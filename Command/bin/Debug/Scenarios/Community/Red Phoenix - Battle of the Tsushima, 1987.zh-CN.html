<BODY scroll=auto><P>第二次朝鲜战争已经结束。&nbsp; 一支中国空降师驻守在双方之间的无人区，确保和平得以维持。&nbsp; 朝鲜已经完了。&nbsp; 即便是苏联迟来的干预也未能阻止其覆灭。&nbsp; 然而，正是那同一场苏联干预在全世界引发了冲击波。&nbsp; 北约与苏联之间的关系比古巴导弹危机时期更接近第三次世界大战。&nbsp; 在北太平洋，一支庞大的苏联水面行动群正准备穿越对马海峡。&nbsp; 唯一的问题是，韩国海军的幸存者以及美国<EM>“星座”号（Constellation）</EM>和<EM>“尼米兹”号（Nimitz）</EM>战斗群挡在了他们的路上。&nbsp; 苏联会在北太平洋开启第三次世界大战，还是会退让以待来日再战？</P></BODY>
