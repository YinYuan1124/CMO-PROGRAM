<BODY scroll=auto><P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><?xml:namespace prefix = "st1" ns = "urn:schemas-microsoft-com:office:smarttags" /><st1:country-region w:st="on"><B style="mso-bidi-font-weight: normal"><SPAN lang=EN-GB style="FONT-SIZE: 13.5pt; mso-ansi-language: EN-GB">阿根廷对英国</SPAN></B></st1:country-region></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p>&nbsp;</o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><STRONG><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">日期/时间：</SPAN></STRONG><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">1982年5月1日 10:00 祖鲁时间<o:p></o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG>地点：</STRONG>马尔维纳斯群岛/福克兰群岛</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG>可扮演方：</STRONG>阿根廷、英国</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">1982年4月2日，阿根廷军队攻占了福克兰群岛（马尔维纳斯群岛，islas Malvinas）。英国组建了一支入侵部队，以夺回福克兰群岛。 </SPAN><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">英国宣布在群岛周边设立全面禁入区（TEZ）。</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">本剧本从5月1日开始，当时阿根廷海军正在海上拦截逼近的英国特混舰队，而巡洋舰 General Belgrano 号尚未被 Conqueror 号击沉。</SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"></SPAN>&nbsp;</P></BODY>
</html>
