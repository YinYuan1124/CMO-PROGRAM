<P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN lang=EN-US style="mso-ansi-language: EN-US"><FONT size=3 face="Times New Roman">作为切断向苏门答腊叛军提供援助的商船交通的最后一步，印尼海军开始在马六甲海峡的 Palau Lingga（林加岛）以东布设水雷。新加坡海军立即派出重兵护航的扫雷舰（MCV）清除这些武器，并在该地区建立完全的航行自由。这一次，印尼部队已准备好以压倒性力量作出反应，给新加坡一个严厉的教训。&nbsp; <BR></FONT></SPAN><SPAN lang=EN-US style="mso-ansi-language: EN-US"><FONT size=3 face="Times New Roman"><BR><EM>灵感来自 Harpoon4 规则书《Sea of Dragons》（龙之海）<BR>想定作者：Francesco Tomasinelli，</EM><A href="mailto:ftomasinelli@gmail.com"><EM>ftomasinelli@gmail.com</EM></A></FONT></SPAN></P><SPAN lang=EN-US style="mso-ansi-language: EN-US"><FONT size=3 face="Times New Roman">
