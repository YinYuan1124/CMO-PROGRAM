	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY scroll=auto><P>时值2018年春季，金正恩似乎终于要兑现其不断发出的进攻韩国的威胁。</P>
<P>在从中国和俄罗斯升级部分军事装备后，金已在边境沿线集结了600多辆坦克、远程炮兵连和步兵部队。&nbsp;朝鲜境内的常规对陆攻击弹道导弹设施已完成升级并处于最高战备状态，攻击/防空作战飞机也在附近空军基地准备就绪。</P>
<P>美国与韩国准备发动“阔剑”行动（OPERATION BROAD SWORD），对朝鲜地面部队实施诸兵种合成攻击。一支加强船队正载着关键作战部队和补给驶往釜山港。</P>
<P>中国在该地区也部署了相当规模的部队，但目前为止尚未被视为敌对。</P>
<P>美国与韩国能否在朝鲜集结的装甲部队抵达首尔之前将其阻止，并让船队安全抵达釜山？</P></BODY></html>
