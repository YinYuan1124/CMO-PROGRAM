<P><STRONG><U>1989 第三次世界大战  红色篇章</U></STRONG></P>
<P><STRONG><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">武装侦察</SPAN></STRONG><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></SPAN></P>
<P><SPAN lang=EN-US style="mso-ansi-language: EN-US">这是基于华约与北约之间假想第三次世界大战的一系列小型场景中的第五个场景。 <o:p></o:p></SPAN></P>
<P><SPAN lang=EN-US style="mso-ansi-language: EN-US">所有这些场景都很小，且仅可从苏联方游玩。<o:p></o:p></SPAN></P>
<P><SPAN lang=EN-US style="mso-ansi-language: EN-US">作者：Miguel Molina 'Meroka37'<o:p></o:p></SPAN></P>
<P><SPAN lang=EN-GB style="mso-ansi-language: EN-GB">&nbsp;</SPAN><SPAN lang=EN-US style="mso-ansi-language: EN-US">注意：在开始向部队下达命令之前，请至少运行场景1秒钟。<o:p></o:p></SPAN></P>
