<BODY scroll=auto><P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN style="mso-ansi-language: EN-GB"><FONT face=Calibri>第三次世界大战开局阶段里斯本遭核毁灭数周之后，葡萄牙武装部队终于迎来了复仇的机会。<?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN style="mso-ansi-language: EN-GB"><FONT face=Calibri>一艘基辅级（Kiev-class）航母成功压制了跟踪它的北约编队，并越过好望角，突入南大西洋。由于大部分海军兵力被牵制在北极、波罗的海和地中海，基辅号（Kiev）水面行动编队与北约跨大西洋补给线之间已无任何阻拦。<o:p></o:p></FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN style="mso-ansi-language: EN-GB"><FONT face=Calibri>葡萄牙空军的两个中队被紧急空运至大加那利岛空军基地（Gran Canaria AFB）。他们的命令是：<o:p></o:p></FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN style="mso-ansi-language: EN-GB"><FONT face=Calibri>“击沉基辅号。为了共和国的荣誉。”<o:p></o:p></FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN style="mso-ansi-language: EN-GB"><o:p><FONT face=Calibri></FONT></o:p></SPAN>&nbsp;</P>
