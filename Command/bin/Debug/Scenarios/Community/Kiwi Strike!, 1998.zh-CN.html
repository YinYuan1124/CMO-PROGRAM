	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY scroll=auto><P>1991年至2001年，新西兰皇家空军（RNZAF）第2中队驻扎在澳大利亚皇家海军（RAN）的航空基地——阿尔巴特罗斯海军航空站（HMAS Albatross）。该中队除为新西兰皇家空军的 A-4K“天鹰”（Skyhawk）飞行员提供改装训练外，还为澳大利亚皇家海军提供训练资源。此类训练通常包括该中队的“天鹰”在新南威尔士州南海岸外的演习中对澳大利亚皇家海军舰艇实施模拟低空攻击。</P>
<P>本场景模拟1998年初对导弹护卫舰“堪培拉”号（HMAS Canberra）的一次全中队攻击。</P></BODY></html>
