<BODY scroll=auto><P>“伊斯兰国”（IS）恐怖组织控制着也门以及索马里和沙特阿拉伯的部分地区。</P>
<P>联合国决议允许保障该地区民用空中和海上交通的安全。</P>
<P>沙特阿拉伯武装部队和政府的状态十分棘手。一些 </P>
<P>人员和军人对 IS 友好并是其成员——另一些人则反对 IS，</P>
<P>与之为敌。</P>
<P>伊朗支持 IS 部队。这个伊斯兰共和国迎来了新的领导人。</P>
<P>局势也非常危险！</P></BODY>
