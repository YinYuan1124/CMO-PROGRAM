<BODY scroll=auto><P><FONT size=4>本想定假定美国与中国之间的紧张关系最终升级为实际敌对行动。令中国意外的是，美国的战略并不是在南海采取攻势，而是确保其盟友有能力自卫。</FONT></P>
<P><FONT size=4>与此同时，美国着手在其他战线攻击中国——网络、太空以及印度洋。毕竟，美国并不需要</FONT><FONT size=4>征服或摧毁中国。美国只需把中国削弱到无法再有效投送力量的程度。</FONT></P>
