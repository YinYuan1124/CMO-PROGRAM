<BODY scroll=auto><P align=center><STRONG><FONT size=5><U>苏联的试探</U></FONT></STRONG></P>
<P><FONT size=4>苏联为扩大其海军舰队的活动范围，近期先后逼近菲律宾、关岛，如今又逼近夏威夷群岛，因而招致不满。由于担心苏联可能发现约翰斯顿环礁（Johnston Atoll）近期的核试验，美国在该地区部署了第75特遣部队（CTF75），以探测并阻止苏联侵入该地区，以及试探其对夏威夷群岛实施先发制人打击的能力。</FONT></P>
<P align=center><FONT color=red size=5><U><STRONG>&nbsp;剧本设计者注释：</STRONG></U></FONT></P>
<P align=left><STRONG><FONT color=#ff0000 size=4>已知的一个问题是，部署在 USS Lexington（CVS-16）上的 SH-34J 直升机在执行完反潜任务后可能不会返回航母。</FONT></STRONG></P>
<P align=left><STRONG><FONT color=#ff0000 size=4>本剧本设定时长为30小时，但若苏联在24小时内仍未发动攻击，则玩家已完成主要目标，此时将弹出一条消息宣布胜利，剧本随即结束。</FONT></STRONG></P></BODY>
