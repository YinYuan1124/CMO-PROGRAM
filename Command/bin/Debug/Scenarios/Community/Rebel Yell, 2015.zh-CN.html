<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><U><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><STRONG><FONT size=3>简介<o:p></o:p></FONT></STRONG></SPAN></U></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><o:p><FONT size=3>&nbsp;</FONT></o:p></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 0pt"><SPAN lang=EN-GB style="mso-ansi-language: EN-GB"><FONT size=3>本场景假设斯洛伐克军队已经叛乱。尽管大多数叛军已经投降，但其中一个斯洛伐克空军基地仍被叛军占据，连同所有可用的装备和文职人员。叛军威胁称，如果他们的无理要求得不到满足，将从1200祖鲁时间开始处决文职人员。斯洛伐克政府的求援得到了几个北约成员国的响应，它们同意提供有限的军事支援以镇压叛乱。</FONT></SPAN></P>
