<BODY scroll=auto><P>由于 AMRAAM 的研制正经历司空见惯的困难，一场演习正在举行，以证明其重要性。本场景系列是一场演习，设想一个敌对空中力量对美国空军使用类似导弹。 </P>
<P>-在本场景中，对手仅装备类似现役 AIM-7 和 AA-10 的半主动雷达制导（SARH）导弹。 </P>
<P>-由于对方飞机由最优秀的 Aggressor 飞行员驾驶，无论其机型如何，预计都将是一场苦战。 </P></BODY>
