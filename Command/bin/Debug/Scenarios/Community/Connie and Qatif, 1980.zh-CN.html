<BODY scroll=auto><P>1979年，沙特阿拉伯沿海的卡提夫（Qatif）地区爆发民众骚乱。&nbsp; 历史上，抗议活动遭到沙特政府的暴力镇压，到当年年底该地区已处于政府控制之下。&nbsp; </P>
<P>本场景假设1979年的抗议引发了更大范围的动荡，到1980年春季已演变为针对沙特王室（House of Saud）的公开叛乱。&nbsp; 另一个复杂因素是，叛军与伊朗的革命领导人在意识形态上有很多共同点；据信伊朗正在向叛军提供军事援助。</P>
<P>场景作者：Mark Gellis</P>
