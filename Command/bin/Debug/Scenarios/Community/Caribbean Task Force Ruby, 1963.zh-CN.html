	<body scroll=auto><P>本场景假定 1962 年导弹危机之后，美国与古巴之间持续的紧张关系在随后数年中引发了一系列事件。</P>
<P>在本场景中，美国对古巴部署新型战术导弹感到担忧。&nbsp; 您的特遣舰队由一艘巡洋舰和三艘驱逐舰组成，并得到一艘潜艇及基韦斯特海军航空站（NAS Key West）飞机的支援，已被派往调查。&nbsp; 您的巡逻区域已在战术地图上标出。&nbsp; </P>
