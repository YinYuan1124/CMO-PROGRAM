<BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><P><FONT color=black size=4>无论战时还是平时，美国海岸警卫队都在进行永无止境的战斗，保护美国和美国人民免受犯罪分子——有时还有他们自身愚蠢行为——的侵害。</FONT></P>
<P class=MsoNormal style="MARGIN: 0in 0in 0pt"><SPAN style="FONT-SIZE: 14pt"><FONT color=#000000>-------------------------------------------------------<?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></FONT></SPAN></P>
<P><SPAN style="FONT-SIZE: 14pt"><FONT color=#000000>注意：在 Command 中，登船和救援行动可以通过让一艘舰船在目标船只附近保持一段时间来模拟。这显然会因任务而异，所以只需让舰船尽可能长时间地贴近目标船只即可；成功的行动将通过消息宣布。</FONT></SPAN></P>
<P><SPAN style="FONT-SIZE: 14pt"><FONT color=#000000>A delta 模板 .ini 文件已包含在 .zip 文件中，以便在数据库未来版本发布时更新本剧本。 <o:p></o:p></FONT></SPAN></P>
