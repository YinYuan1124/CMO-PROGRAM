<BODY scroll=auto><P>“Peshmerga”（佩什梅格）的大致意思是“直面死亡的人”。</P>
<P>在这个假想剧本中，ISIL（伊拉克和黎凡特伊斯兰国）从伊拉克和叙利亚军队手中缴获了多得多的完好军事装备，并且也具备使用这些装备的技术能力。预计会看到美国、伊拉克、叙利亚和伊朗的军事装备。你正在猎杀一支由火炮和装甲运兵车组成的车队，该车队从南部驶向摩苏尔，然后转向西面，前往辛贾尔山（Mount Sinjar）的雅兹迪人营地。为取得成功，你需要向雅兹迪人营地空投补给和伞兵。你将从土耳其、科威特和塞浦路斯的基地派出英国和美国飞机。 </P>
<P>剧本作者：Aaron Wallace</P></BODY>
