<BODY scroll=auto><P><SPAN style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; FLOAT: none; COLOR: rgb(68,68,68); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; WIDOWS: 1; DISPLAY: inline !important; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px"><FONT color=black>本想定改编自桌游《鱼叉：舰长版》（Harpoon: Captain's Edition）中的“水面遭遇”想定。</FONT></SPAN></P>
<P><SPAN style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; FLOAT: none; COLOR: rgb(68,68,68); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; WIDOWS: 1; DISPLAY: inline !important; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px"><FONT color=black></FONT></SPAN>&nbsp;</P>
<P><SPAN style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; FLOAT: none; COLOR: rgb(68,68,68); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; WIDOWS: 1; DISPLAY: inline !important; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px"><FONT color=black>&nbsp;在本想定中，一艘<SPAN class=Apple-converted-space>&nbsp;</SPAN></FONT></SPAN><A style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; COLOR: rgb(77,70,156); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; TEXT-DECORATION: none; WIDOWS: 1; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px" href="https://en.wikipedia.org/wiki/Arleigh_Burke-class_destroyer" target=_blank><FONT color=black>Arleigh Burke 级</FONT></A><SPAN style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; FLOAT: none; COLOR: rgb(68,68,68); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; WIDOWS: 1; DISPLAY: inline !important; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px"><FONT color=black><SPAN class=Apple-converted-space>&nbsp;</SPAN>驱逐舰正在挪威海护航一艘&nbsp;Whidbey Island 级船坞登陆舰，并恰巧发现一艘苏联<SPAN class=Apple-converted-space>&nbsp;</SPAN></FONT></SPAN><A style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; COLOR: rgb(77,70,156); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; TEXT-DECORATION: none; WIDOWS: 1; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px" href="https://en.wikipedia.org/wiki/Sovremennyy-class_destroyer" target=_blank><FONT color=black>Sovremenny 级驱逐舰</FONT></A><SPAN style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; FLOAT: none; COLOR: rgb(68,68,68); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; WIDOWS: 1; DISPLAY: inline !important; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px"><FONT color=black><SPAN class=Apple-converted-space>&nbsp;</SPAN>与一艘<SPAN class=Apple-converted-space>&nbsp;</SPAN></FONT></SPAN><A style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; COLOR: rgb(77,70,156); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; TEXT-DECORATION: none; WIDOWS: 1; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px" href="https://en.wikipedia.org/wiki/Ivan_Rogov-class_landing_ship" target=_blank><FONT color=black>Ivan Rogov 级登陆舰</FONT></A><SPAN style="WHITE-SPACE: normal; TEXT-TRANSFORM: none; WORD-SPACING: 0px; FLOAT: none; COLOR: rgb(68,68,68); FONT: 13px/20px Arial, Tahoma, Helvetica, FreeSans, sans-serif; WIDOWS: 1; DISPLAY: inline !important; LETTER-SPACING: normal; BACKGROUND-COLOR: rgb(255,255,255); TEXT-INDENT: 0px; -webkit-text-stroke-width: 0px"><FONT color=black>。&nbsp;双方随即爆发小规模交战，都试图击沉对方所护航的舰艇。&nbsp;苏军若击沉那艘&nbsp;LSD 即获胜，而美军若能击沉 Rogov 则获胜。</FONT></SPAN></P></BODY>
