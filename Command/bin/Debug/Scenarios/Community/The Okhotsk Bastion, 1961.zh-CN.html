<BODY scroll=auto><P>随着肯尼迪下令采取更为强硬的海军政策，苏联以一场其规模最大的反潜作战之一作为回应。本剧本描绘了假想中的苏联航空母舰与海军飞机设计被投入对美军水下力量的作战。</P>
<P>注释：</P>
<P>请确保将“Unlimited Aircraft Ordnance”（飞机弹药无限）设置为“Yes”（是），如果尚未勾选的话。虽然弹药库已经填满，但本剧本设计时就是要在启用该选项的情况下游玩的。</P>
<P>剧本中的苏联军舰名称是历史名称与虚构名称的混合。</P>
<P>-剧本作者：Coiler12</P>
<P>-特别感谢 Randomizer 提供的宝贵意见。</P></BODY>
