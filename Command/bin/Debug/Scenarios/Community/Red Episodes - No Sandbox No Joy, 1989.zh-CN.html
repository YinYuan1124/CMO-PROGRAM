<BODY scroll=auto><P><STRONG><U><SPAN lang=EN-US style="mso-ansi-language: EN-US">1989 第三次世界大战  红色篇章</SPAN></U></STRONG><SPAN lang=EN-US style="mso-ansi-language: EN-US"><?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></SPAN></P>

<P><SPAN lang=EN-US style="mso-ansi-language: EN-US"><STRONG>没有沙盒就没有乐趣</STRONG></SPAN></P>
<P><SPAN lang=EN-US style="mso-ansi-language: EN-US">这是基于华约与北约之间假想第三次世界大战的一系列小型场景中的第四个场景。 <o:p></o:p></SPAN></P>
<P><SPAN lang=EN-US style="mso-ansi-language: EN-US">所有这些场景都很小，且仅可从苏联方游玩。<o:p></o:p></SPAN></P>
<P><SPAN lang=EN-US style="mso-ansi-language: EN-US">作者：Miguel Molina 'Meroka37'<o:p></o:p></SPAN></P>
<P>&nbsp;<SPAN lang=EN-US style="mso-ansi-language: EN-US">注意：在开始向部队下达命令之前，请至少运行场景1秒钟。<o:p></o:p></SPAN></P></BODY>
