<BODY scroll=auto>苏联攻势正席卷丹麦。他们打击了我们在挪威南部的海军力量，并摧毁了丹麦和挪威南部的海岸雷达站。目前敌对行动已平息，没有迹象表明他们打算入侵挪威南部。因此，我们大部分可用兵力都被部署用于保卫挪威北部。
<P>一支苏联特混舰队正从波罗的海驶往北海，由一艘斯维尔德洛夫级（Sverdlov-class）巡洋舰、两艘油船和数艘护航舰艇组成。</P>
<P>在他们抵达北海之前，摧毁苏联巡洋舰和油船。他们绝不能与目前正在北海活动的其他苏联海军力量会合。</P></BODY>
