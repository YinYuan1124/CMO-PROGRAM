<BODY scroll=auto><P>第三次世界大战一触即发。在东地中海，USS Roosevelt（“罗斯福”号）被苏联军舰包围。俄军三个强大的水面行动群正向美军集结逼近，目标只有一个：击沉航母！</P>
<P>谁将赢得这场“第一轮齐射之战”？</P>
<P>注：本场景改编自 Michael A. Palmer 所著《<U>The War That Never Was</U>》一书。</P></BODY>
