<BODY scroll=auto><P>欢迎来到西菲律宾海。这里美丽富饶、自然资源丰富，是地球上争夺最激烈的海洋领土之一，至少有七个主权国家竞相争夺其渔场和未开发的石油储量。 </P>
<P><STRONG>态势：</STRONG> 菲律宾海军在巴拉望岛的牡蛎湾（Oyster Bay）新建了一个巡逻部队基地。该基地正对西菲律宾海，便于进入北端至关重要的 Malampaya 油田周围的安全区，以及西部和南部有争议的浅滩。牡蛎湾现已成为海军大多数主力作战舰艇的母港，包括两艘前美国海岸警卫队（USCG）高续航力巡逻舰和新加入的纳万蒂亚（Navantia）制造的近海巡逻舰（OPV）。巡逻将从这里展开，以确保领土安全并强化海上主张。</P></BODY>
