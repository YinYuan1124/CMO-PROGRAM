<BODY scroll=auto><B>日期：</B> 1985 年 12 月 6 日 <BR><B>地点：</B> 北大西洋 <BR><B>可玩方：</B> 苏联 <BR><B>时长：</B> 1 天 <BR>
<P>第三次世界大战已经全面打了一周，但迄今双方都未取得稳固优势。苏联在欧洲取得了迅速进展，但红军正因北约的空袭而遭受重创。在海战方面，北约已将红旗北方舰队限制在挪威海内，并于昨天对苏联发动了一场大规模的航母舰载机空袭，双方均损失惨重。</P></BODY>
