<BODY scroll=auto><B>日期：</B> 1987 年 3 月 25 日 <BR><B>地点：</B> 西大西洋 <BR><B>可玩方：</B> 苏联 <BR><B>时长：</B> 32 小时 <BR>
<P>冷战的大部分时间里，美国在声呐、信号处理和潜艇静音方面享有技术优势。然而到了 20 世纪 80 年代中期，苏联在潜艇静音方面取得了巨大飞跃，最新的 Victor-III 级潜艇在隐蔽性上已可与美国的 Sturgeon 级相媲美。这些惊人的进步在很大程度上要归功于 Walker 间谍网和 Toshiba-Kongsberg 事件。 </P>
<P>在几十年来于行动自由方面一直“落后一步”之后，1987 年春天，Chernavin 海军上将发起了“Atrina”行动，此后美国海军情报界将其称为“苏联潜艇大偷袭”。</P></BODY>
