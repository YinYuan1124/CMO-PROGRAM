<BODY scroll=auto><B>日期：</B> 2017 年 10 月 9 日 <BR><B>地点：</B> 北冰洋 <BR><B>可玩方：</B> 俄罗斯 <BR><B>时长：</B> 16 小时 <BR>
<P>随着俄罗斯联邦在共产主义崩溃后重新确立其世界大国地位，俄罗斯势力范围内的多个热点地区紧张局势不断加剧。俄罗斯国防部的高级官员希望表明，俄罗斯仍保有并正在改进其战略潜射核导弹能力。</P>
<P>作为一系列旨在提升俄罗斯海军战备水平并向世界展示能力的演习的一部分，一艘 Delta IV 级弹道导弹核潜艇（SSBN）受命避开北方舰队最现代化舰艇组成的强大兵力，然后对堪察加半岛的一处机场实施模拟核打击。</P></BODY>
