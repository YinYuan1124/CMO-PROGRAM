<BODY scroll=auto><B>日期：</B> 1998 年 10 月 13 日 <BR><B>地点：</B> 鄂霍次克海 <BR><B>可玩方：</B> 美国 <BR><B>时长：</B> 2 天 <BR>
<P>继 9 月 10 日 Severomorsk 发生一起未遂哗变和劫持 Akula 级核动力攻击潜艇（SSN）事件之后，越来越多的迹象令人担忧俄罗斯海军内部即将发生政变。</P>
<P>最令人担忧的是俄罗斯战略核武器的控制权，尤其是潜艇部队中的这类武器。<I>SSN 21 Seawolf</I> 已被派往鄂霍次克海，监视俄罗斯海军活动，并在局势需要时提供先发打击能力。</P></BODY>
