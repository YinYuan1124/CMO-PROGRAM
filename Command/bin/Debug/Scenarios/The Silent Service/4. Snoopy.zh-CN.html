<BODY scroll=auto><B>日期：</B> 1969 年 5 月 28 日 <BR><B>地点：</B> 巴伦支海 <BR><B>可玩方：</B> 美国 <BR><B>时长：</B> 2 天 <BR>
<P>情报报告显示，苏联国土防空军（PVO）正在以科拉半岛为中心的一场大规模防空演习中测试一种新型火控雷达。海军情报局和国家安全局急于分析这种新雷达的电磁辐射，以便研发对抗措施。</P>
<P>在完成北极点部署返航途中，<I>SSN 638 Whale</I> 受命隐蔽记录苏联海岸线沿岸防空系统的辐射信号。</P></BODY>
