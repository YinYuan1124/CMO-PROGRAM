<BODY scroll=auto><B>日期：</B> 1977 年 4 月 14 日 <BR><B>地点：</B> 巴伦支海 <BR><B>可玩方：</B> 皇家海军 <BR><B>时长：</B>&nbsp;1 天<BR>
<P>苏联的第一艘航空母舰 TAKR 075 <I>Kiev</I> 于 1977 年初服役，在整个北约海军情报界引起轰动。苏联舰载航空兵的威胁不仅对西方构成了新的危险挑战，而且关于这艘航母本身的实际设计与能力，可获取的情报少得令人沮丧。</P>
<P>在巴伦支海巡逻、监视一年一度的红旗北方舰队 Sever-77 演习期间，皇家海军的 <I>HMS Swiftsure</I> 抓住了一次难得的机会，近距离接触一艘苏联主力舰，获取了宝贵的摄影和声学情报……</P></BODY>
