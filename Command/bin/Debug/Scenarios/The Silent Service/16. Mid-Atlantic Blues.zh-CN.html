<BODY scroll=auto><B>日期：</B> 1985 年 12 月 9 日 <BR><B>地点：</B> 东大西洋 <BR><B>可玩方：</B> 苏联 <BR><B>时长：</B> 32 小时 <BR>
<P>经过近两周的战斗，北约在欧洲的部队开始动摇。战线正缓慢但确实地向莱茵河以西后移，双方都损失惨重。苏联在挪威海的出人意料的反击，给北约在欧洲大陆与美国之间的海上交通线带来了额外压力。</P>
<P>为了支撑其日渐衰弱的防御，北约依赖多支从美国运送部队和物资的护航船队。尽管格陵兰—冰岛—英国潜艇屏障遏制了苏联潜艇活动的大部分，但一支小型苏联潜艇编队已设法在法国西海岸外占据了阵位……</P></BODY>
