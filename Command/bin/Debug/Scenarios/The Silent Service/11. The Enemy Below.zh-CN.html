<BODY scroll=auto><B>日期：</B> 1950 年 8 月 28 日 <BR><B>地点：</B> 日本海 <BR><B>可玩方：</B> 美国 <BR><B>时长：</B> 2 天 <BR>
<P>联合国对朝鲜的干预进展不顺。朝鲜人民军（KPA）已将联合国部队逼退至距釜山港约 60 海里的一个狭小登陆场。韩国（RoK）陆军和美国第 8 集团军的残部目前正准备在洛东江沿线对这一环形防线进行殊死防御。 </P>
<P>朝鲜人民军进攻的速度和势头超出了所有战前估计；情报部门怀疑朝鲜人民军正从苏联和中华人民共和国获得物资援助。在美国第 7 舰队主力准备在首尔发动反攻之际，<I>USS Segundo</I> 受命识别可能正在协助战争行动的苏联船只。</P></BODY>
