	<body scroll=auto><B>日期：</B>2002 年 5 月 26 日 <BR><B>地点：</B>阿拉伯海 <BR><B>可玩方：</B>印度 <BR><B>时长：</B>36 小时 <BR>
<P>2001 年 12 月印度议会遭袭后，印度与巴基斯坦之间的紧张关系达到前所未有的高度。两国均已动员部队，在边境沿线部署了数十万军队。克什米尔地区已发生迫击炮和炮火交火，两天前巴基斯坦政府开始了一系列核试验。</P>
<P>作为战争计划的一部分，印度海军的 <I>INS Shalki</I>（“沙尔基”号）受命将一个 MARCOS 特种作战小组部署到卡拉奇港执行侦察任务。巴基斯坦部队处于高度戒备状态，整个地区都处于热核一触即发之势……</P></body>
