<BODY scroll=auto><B>日期：</B> 1985 年 12 月 18 日 <BR><B>地点：</B> 金兰湾 <BR><B>可玩方：</B> 美国 <BR><B>时长：</B> 12 小时 <BR>
<P>来自美国的北约增援部队抵达，极大地改变了欧洲的局势，苏联地面部队从其推进最远的法国东部和比荷卢地区被逼退到东德边界以外。由于双方似乎都不太可能动用核武器，和平谈判正在日内瓦进行。 </P>
<P>与此同时，在太平洋战区，越南和朝鲜正承受来自苏联越来越大的压力，要其开辟第二战线，以增强华沙条约组织在谈判桌上的地位。由于苏联太平洋舰队主力集中在鄂霍次克海堡垒的安全区域，海军特种作战司令部会同第 7 舰队受命向太平洋地区的潜在对手发出明确信号。 </P></BODY>
