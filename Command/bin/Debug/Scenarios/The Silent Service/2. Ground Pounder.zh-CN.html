<BODY scroll=auto><B>日期：</B> 1992 年 3 月 9 日 <BR><B>地点：</B> 印度洋 <BR><B>可玩方：</B> 美国 <BR><B>时长：</B> 8 小时 <BR>
<P>在邻国兼敌国伊拉克遭遇军事失败后，伊朗的 Khamenei 政权变得更加胆大，对海湾国家和美国的敌意日益加深。最近获得配备反舰导弹的俄罗斯 SU-24 Fencer 打击飞机，使阿亚图拉 Khamenei 关于对外国航运关闭霍尔木兹海峡的威胁更具分量。</P>
<P>由于空袭被认为风险过大，Bush 总统已批准实施巡航导弹打击，以消除伊朗 SU-24 的威胁……</P></BODY>
