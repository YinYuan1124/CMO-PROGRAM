<BODY scroll=auto><B>日期：</B> 1985 年 12 月 6 日 <BR><B>地点：</B> 东大西洋 <BR><B>可玩方：</B> 苏联 <BR><B>时长：</B> 8 小时 <BR>
<P>昨天，北约对科拉半岛和被占领的挪威境内的苏联设施发动了一场大规模的航母舰载机打击，严重损坏了若干机场和后勤中心。作为报复，苏联海军航空兵对北约航母编队实施了一次多团规模的导弹打击，击沉了航母 <I>USS John F Kennedy</I> 和 <I>USS Dwight D Eisenhower</I>。剩余的航母 <I>USS America</I> 和 <I>USS Forrestal</I> 正南下补充弹药，据推测其意图是返回挪威海协助海上控制战役。</P>
<P>在航母打击群后撤重新装弹之际，红旗北方舰队潜艇师还留有一份最后的惊喜……</P></BODY>
