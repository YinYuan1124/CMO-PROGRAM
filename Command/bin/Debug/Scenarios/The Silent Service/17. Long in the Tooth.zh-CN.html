<BODY scroll=auto><B>日期：</B> 1985 年 12 月 12 日 <BR><B>地点：</B> 西大西洋 <BR><B>可玩方：</B> 苏联 <BR><B>时长：</B> 36 小时 <BR>
<P>第三次世界大战已持续一周。苏联地面部队在欧洲取得了巨大进展，碾压西德，并将北约逼退至法国边境。比利时和荷兰正在进行殊死战斗，而北方的挪威也正遭受攻击。</P>
<P>由于北约反潜部队的努力，红旗北方舰队潜艇部队大部分被限制在东大西洋，并在那里对盟军航运造成严重破坏。北约联盟并不知晓，一艘老旧的 November 级攻击潜艇已悄然逼近美国东海岸，刚刚接到命令要让自己的存在为人所知……</P></BODY>
