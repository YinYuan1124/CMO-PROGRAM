<BODY scroll=auto><B>日期：</B> 1985 年 11 月 29 日 <BR><B>地点：</B> GIUK 缺口 <BR><B>可玩方：</B> 北约 <BR><B>时长：</B> 2 天 <BR>
<P>在一艘美国驱逐舰与一艘苏联间谍船于海上发生事件后，世界徘徊在第三次世界大战的边缘。随着苏联红旗北方舰队从巴伦支海的基地出动，东大西洋的北约潜艇紧急出动，力图在这些红色潜艇突入西大西洋之前将其拦截。</P></BODY>
