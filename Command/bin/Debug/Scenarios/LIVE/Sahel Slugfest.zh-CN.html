<BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><P>一向动荡的苏丹和乍得在高层各有朋友。苏丹利用西方制裁与北京建立了广泛联系，而法国则一直在其前殖民地保持存在。 </P>
<P>奥马尔·巴希尔（Omar al-Bashir）倒台后苏丹的动荡导致了一个史无前例的举动。由于害怕失去长期客户，中国动用了一切暗中手段，随后展开了自 1979 年以来最大规模的部署，以支撑其新的强人。随着物资流入，它与乍得及其背后的靠山发生了冲突，对方也以同样方式回应。 </P>
<P>如今，大规模战斗似乎已不可避免。&nbsp; </P></BODY>
