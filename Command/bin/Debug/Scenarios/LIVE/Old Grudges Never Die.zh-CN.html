<BODY scroll=auto><P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN style="mso-ansi-language: EN-CA"><FONT face=Calibri>场景简报<?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" /><o:p></o:p></FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN style="mso-ansi-language: EN-CA"><FONT face=Calibri>叙利亚内战始于 2011 年初的<B style="mso-bidi-font-weight: normal"><I style="mso-bidi-font-style: normal">阿拉伯之春</I></B>（Arab Spring），但自那以后只变得越来越复杂。<SPAN style="mso-spacerun: yes">&nbsp; </SPAN>在国际紧张局势高企、如此多的玩家在极其狭小的空间内角力的情况下，这场冲突竟未蔓延为一场全面地区战争乃至全球战争，实属惊人。<o:p></o:p></FONT></SPAN></P>
<P class=MsoNormal style="MARGIN: 0cm 0cm 8pt"><SPAN style="mso-ansi-language: EN-CA"><FONT face=Calibri>任何升级中最可能的两个主角是俄罗斯和土耳其，这两个国家之间长期存在诸多分歧和积怨。<SPAN style="mso-spacerun: yes">&nbsp; </SPAN>在本场景中，你可以扮演俄罗斯或土耳其，努力维护国家荣誉与尊严，同时将敌对行动限制在有限范围。美国、联军、叙利亚、ISIS 和叛军部队会让你的努力复杂化。胜利并不总是取决于造成伤亡。</FONT><o:p></o:p></SPAN></P></BODY>
