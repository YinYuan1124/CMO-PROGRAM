		<p>本想定假设在巴基斯坦北部发现了基地组织营地，并假设巴基斯坦不愿让美国直接打击这些恐怖分子，理由是在其主权领土内发现的营地属于其管辖。（公平地说，这个论点并非完全不合理——想象一下，如果像法国或日本这样的盟友突然宣布他们在缅因州或新泽西州发现了恐怖分子，并想用激光制导炸弹打击居民区，美国会如何反应。）然而，在本例中，人力情报来源表明巴基斯坦军方内部有人同情基地组织，并试图庇护恐怖分子。华盛顿打算采取行动。</p>
		<p>巴基斯坦警告美国，不会容忍对其领土内目标的直接军事行动。然而，总统无意让恐怖分子逃脱正义。</p>
