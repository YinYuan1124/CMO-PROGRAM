		<p>本想定假设墨西哥与危地马拉之间的紧张关系近几个月有所升级。当墨西哥军队向一艘误入墨西哥领海的危地马拉渔船开火时，事态达到顶点。对袭击的说法不一，但看起来渔船起初拒绝向墨西哥军队投降，并试图逃回国际水域。然而，许多人认为墨西哥使用的武力过度。</p>
		<p>由于墨西哥军队已因控制毒品卡特尔而捉襟见肘，有人担心危地马拉会发动某种惩罚性远征。</p>
		<p>本想定旨在让玩家练习空袭对地面部队的想定，也意在展示用 Command 可以创建的各种想定。Command 允许设计者模拟世界上曾经发生并仍在发生的低强度冲突中的大量小型交战。</p>
		<p>作者：Mark Gellis。压缩包内附有用于更新数据库版本的 .ini 模板。</p>
