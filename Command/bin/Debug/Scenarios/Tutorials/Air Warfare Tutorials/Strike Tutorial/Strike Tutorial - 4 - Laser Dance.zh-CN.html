		<p>在本教程中，你将处理地形遮蔽、云层覆盖和激光制导炸弹。这些因素组合起来可能令人沮丧，有时云层会完全阻止你使用激光制导武器。本教程中的云层不算太糟，但仍会限制你的选择。</p>
		<p>今天你只有两架飞机可用：两架英国 Harrier GR.7，灵活、坚固且多用途。目标是隐藏在艾尔山脉中的大型通信设施。哦，还有两套非常先进的 SAM 系统保护着目标区域。</p>
		<p>注：本教程约需 20 分钟完成。作者：Gunner98，又名 Bart Gauvin。</p>
