		<p>When the F-16I has taken off, you can finally control it.</p>
		<p>To plot a course, select the aircraft and press F3. An arrow will appear under your pointer, click on a point of the map to plot the first course. You can then plot another waypoint or press "ESC" to confirm your desired route.</p>
