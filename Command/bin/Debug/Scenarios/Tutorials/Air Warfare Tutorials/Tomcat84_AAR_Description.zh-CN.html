	<body>
		<p>本教程旨在帮助你理解《Command》中的空中加油概念。完成本教程后，你应能更好地了解如何设置不同类型的加油机任务，以及如何有效地调整加油条令以获得最佳效果。</p>
		<p>在本教程中，你将：</p>
		<ul>
			<li>为在训练区域内活动的多架战斗机加油</li>
			<li>伴随战斗机执行转场任务，并在中途为它们加油</li>
			<li>观察手动加油和自动加油的实际操作</li>
			<li>了解如何让一架加油机为另一架加油机加油</li>
			<li>学习硬管加油（Boom）与软管-锥套加油（Probe and Drogue）的区别</li>
		</ul>
	</body>
