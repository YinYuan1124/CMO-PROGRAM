		<p>欢迎来到货物运输教程。</p>
		<p>这是旨在教授玩家 CMO 货物运输基础知识的教程。本教程将涵盖以下内容：</p>
		<ul>
			<li>如何创建货运任务（从设施向登陆区运送货物）。</li>
			<li>如何手动将货物装载到飞机或登陆舰上。</li>
			<li>如何从飞行中的飞机卸载货物（伞降和速降）。</li>
			<li>如何让空中飞机接走地面单位。</li>
			<li>如何向设施（舰船或建筑）添加货物。</li>
		</ul>
		<p>作者：Andrea D.，又名 SirAndrew。</p>
