		<p><strong>基础水面作战 3 – 基础防空作战</strong></p>
		<p>时长：4 小时游戏时间（时间压缩下平均约 15 分钟）</p>
		<p>地点：菲律宾海</p>
		<p>这是系列教程中的第三篇，旨在教授玩家《Command》水面作战的基础知识。本教程将涵盖以下内容：</p>
		<ul>
			<li>操作对空搜索雷达</li>
			<li>操作电子支援措施（ESM）</li>
			<li>用防空火炮攻击目标</li>
			<li>用面空导弹攻击目标</li>
			<li>用近防武器系统攻击目标</li>
			<li>部署诱饵和对抗措施</li>
		</ul>
