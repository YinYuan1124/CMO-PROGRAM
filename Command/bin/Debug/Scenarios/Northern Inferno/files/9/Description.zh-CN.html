<body scroll=auto><P >日期/时间：&nbsp;<strong>22
September, 1975 / 10:00:00 Zulu</strong><br>地点：<strong>英国北部（Northern United Kingdom）</strong><br>
时长：<strong>6 小时</strong><br></P>
<P class=auto-style1 style="MARGIN: 0cm 0cm 0pt">
<img height="460" src="AREA%20OF%20OPERATIONS%20MAP.jpg" width="580"></P>
<P ><strong>引言</strong><br>&nbsp;<br>过去几周，挪威北部的机场遭到苏军反复猛烈打击，已无法供固定翼飞机使用。前沿部署的皇家空军部队现已撤回苏格兰的空军基地，以加强本土防御。</P>
<P >迄今为止，英国本土尚未遭到直接攻击；但情报显示，UKADGE 和北部机场是下一批目标。<br>&nbsp;<br>侦察飞行和卫星图像已在科拉半岛发现多个加满油、装好弹并配属支援力量的轰炸机团。预计这些部队将成为对英国本土进攻的矛头。</P>
<P >皇家空军能否再次保卫王室与国家？</P>
