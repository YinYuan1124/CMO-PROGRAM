		<p>原创意：Mike Mykytyn</p>
		<p>日期：1971 年 9 月 23 日</p>
		<p>地点：加勒比海</p>
		<p>可玩方：美国</p>
		<p>时长：2 天</p>
		<p>1970 年，基辛格国务卿告知尼克松总统，U-2 侦察飞行证实了有关在古巴西恩富戈斯建造可支持弹道导弹潜艇的苏联潜艇基地的报告。美国政府对苏联的试探迅速作出反应，举行了一系列会议，重申 1962 年不在古巴部署进攻性核武器的协议。苏联退让，西恩富戈斯综合设施的建设停止。</p>
		<p>现在是 1971 年秋天，尼克松政府正专注于中国、越南和即将到来的选举。苏联察觉到软肋，决定再次碰碰运气。</p>
