		<p>原创意：Paul Bridge</p>
		<p>日期：1979 年 10 月 30 日</p>
		<p>地点：英吉利海峡</p>
		<p>可玩方：FOST 单位</p>
		<p>时长：24 小时</p>
		<p>海上训练旗官（FOST）是皇家海军的一个训练组织，负责训练皇家海军和皇家辅助舰队的舰艇，使其适合加入作战舰队。FOST 让船员和舰艇接受严格的演习和战备检查，最长可持续八周，为任何可能情况做好准备。</p>
		<p>最终评估之一是在敌方潜艇攻击下保护一艘高价值单位前往会合点。你能接受挑战吗？</p>
