		<p>原创意：Paul Bridge</p>
		<p>日期：1961 年 6 月 25 日</p>
		<p>地点：波斯湾</p>
		<p>可玩方：英国</p>
		<p>时长：2 天</p>
		<p>难以预测的阿卜杜勒·卡里姆·卡塞姆于 1958 年在伊拉克夺取政权，使该地区动荡不安。1961 年，英国从科威特撤军后，卡塞姆单方面宣布科威特应被视为伊拉克领土，并将作为伊拉克第 19 个省并入伊拉克。英国政府曾向科威特保证，如果其领土遭到攻击，将提供军事支持。因此，当这个新独立国家请求保护时，英国海陆空部队在几天内就位，执行代号为“优势”行动的紧急军事行动。</p>
