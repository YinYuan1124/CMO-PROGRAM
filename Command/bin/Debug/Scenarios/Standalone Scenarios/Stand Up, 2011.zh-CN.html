		<p>时长：36 小时</p>
		<p>在西南亚进行一场昂贵的陆地平叛战争，迫使英国国防部以任何潜在对手都难以企及的速度削减皇家海军和皇家空军。这场旷日持久且不受欢迎的冲突继续使国防部捉襟见肘，而政治阴谋也在稳步侵蚀皇家海军的投送能力。</p>
		<p>随着阿根廷内部动乱酝酿，一个宿敌看到了改善自身地位、重新提出一项具有全国重要性且受欢迎的主张，并在即将到来的选举中锁定胜利的机会。历史会重演吗？</p>
