		<p>北约对苏联</p>
		<p>日期/时间：1963 年 4 月 3 日 / 08:00:00 Zulu</p>
		<p>地点：北大西洋</p>
		<p>时长：2 天</p>
		<p>可玩方：北约</p>
		<p><strong>局势</strong></p>
		<p>1963 年 4 月初，大西洋海战正酣，苏联潜艇开始涌入大西洋，试图在过程中淹没北约反潜力量。</p>
		<p>北大西洋和挪威海的早期行动远比北约预想的残酷，双方都损失惨重。</p>
		<p>北约已组建数支来自加拿大、美国、英国和荷兰的反潜猎杀小组，这些部队应能遏制这股洪流。</p>
		<p>Paul Bridge，作者与想定设计者。</p>
