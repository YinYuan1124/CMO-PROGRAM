		<p>原创意：Mike Mykytyn</p>
		<p>日期：1976 年 1 月 19 日</p>
		<p>地点：亚丁湾</p>
		<p>可玩方：美国</p>
		<p>时长：5 小时</p>
		<p>随着苏联与索马里关系改善，美国加强了在亚丁湾的空中和海上巡逻。大约一小时前，来自 VAQ-130“Zappers”的一架海军 EKA-3B 飞机“Raven 21”在索马里海岸上空巡逻时报告被地对空导弹阵地锁定。片刻后失去联系，不久后搜救信标启动。</p>
		<p>总统已批准从 Tarawa 两栖戒备群登陆一支小型海豹突击队和海军陆战队分队，以找到并保护坠机现场，直到黎明时在 Oriskany 航母战斗群支援下发动直升机救援。局势紧张，行动必须巧妙执行，以避免升级为美苏对抗。</p>
