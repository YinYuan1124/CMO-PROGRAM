		<p>原创意：Mike Mykytyn</p>
		<p>日期：2014 年 5 月 27 日</p>
		<p>地点：纳戈尔诺-卡拉巴赫</p>
		<p>可玩方：俄罗斯</p>
		<p>时长：3 天</p>
		<p>纳戈尔诺-卡拉巴赫飞地仍是前苏联地区争夺最激烈的地区之一。冲突始于 1988 年，1992 年 1 月该飞地宣布从阿塞拜疆独立，理由是亚美尼亚族人口希望从大阿塞拜疆获得自治，冲突随之升级。亚美尼亚自然站在其族裔兄弟一边，参与了一场血腥冲突，最终由俄罗斯斡旋于 1994 年停火。此后紧张局势时起时伏，推动地区军备竞赛和偶发冲突，使俄罗斯再次可能不得不介入。</p>
