		<p>原创意：Christopher Stoner</p>
		<p>日期：2013 年 5 月 13 日</p>
		<p>地点：索马里基斯马尤</p>
		<p>可玩方：美国</p>
		<p>时长：5 小时</p>
		<p>可靠情报确定，一名基地组织信使正将协调撒哈拉以南非洲进一步恐怖行动的信息带给索马里青年党领导委员会。国家指挥当局已投入 Kearsarge 两栖戒备群的部队，如果情报可信就采取行动。Kearsarge 号和唯一护航舰——濒海战斗舰 USS Independence——已先行于编队其余舰艇，以便在索马里南部城市基斯马尤近海执行这次秘密任务。</p>
		<p>他们的任务：找到并监视这名信使，希望他能带他们找到青年党领导层；如果找到，就发动直接行动将其抓获。</p>
