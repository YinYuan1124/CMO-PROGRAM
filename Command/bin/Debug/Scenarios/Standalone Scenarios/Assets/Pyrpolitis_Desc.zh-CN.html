		<p>原创意：Dimitris Dranidis</p>
		<p>日期：2014 年 1 月 30 日</p>
		<p>地点：爱琴海</p>
		<p>可玩方：希腊</p>
		<p>时长：8 小时</p>
		<p>“Pyrpolitis（点火者）1/14”是希腊空军（HAF）快速反应部队于 2014 年 1 月 30 日星期四凌晨执行的 COMAO 演习，属于更大规模“Astrapi（闪电）1/14”联合部队演习的一部分。演习期间，来自多个 HAF 基地的飞机参与了对希俄斯岛附近一支强大海军编队（及其空中掩护）的突击。这是该演习想定的复刻。</p>
