		<p>原创意：Ragnar Emsoy</p>
		<p>日期：1985 年 10 月 1 日</p>
		<p>地点：地中海</p>
		<p>可玩方：以色列</p>
		<p>时长：13 小时</p>
		<p>为回应以色列国防军抓获一名知名高级指挥官，巴解组织“第 17 部队”特工劫持了一艘以色列小游艇并处决了 3 名以色列公民。以色列的回应是：清晨对突尼斯境内被认为是安全庇护所的巴解组织基础设施发动突然空袭。</p>
