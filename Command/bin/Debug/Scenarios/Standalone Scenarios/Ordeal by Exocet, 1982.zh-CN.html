		<p>阿根廷对英国</p>
		<p>日期：1982 年 6 月 12 日</p>
		<p>地点：东福克兰群岛</p>
		<p>可玩方：英国</p>
		<p>时长：5 小时</p>
		<p><strong>局势</strong></p>
		<p>HMS Glamorgan 和 HMS Yarmouth 完成物资和燃料补给后返回阵位；随着福克兰战役达到高潮，两舰被召回支援正在参加“双姐妹”战斗的皇家海军陆战队。</p>
		<p>6 月 12 日星期六上午，Glamorgan 被一枚从陆基发射器发射的“飞鱼”导弹击中；本想定增强了 HMS Yarmouth 在炮线上的参与，并加入了一些额外惊喜。</p>
		<p>Paul Bridge，作者与想定设计者。</p>
