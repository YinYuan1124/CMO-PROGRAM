		<p>原创意：Ragnar Emsoy</p>
		<p>日期：1957 年 10 月 17 日</p>
		<p>地点：挪威海岸芬马克地区</p>
		<p>可玩方：挪威、苏联</p>
		<p>时长：6 小时</p>
		<p>导弹艇（MTB）专为高速夜间作战设计，能够接近敌舰到足以发射鱼雷的距离。这些艇几乎没有装甲，依靠突然性、速度和机动性来避免被还击炮火击中。</p>
		<p>这个快节奏想定让挪威 MTB 在崎岖的挪威海岸外对抗苏联 MTB。此时反舰导弹尚未出现，玩家必须依靠火炮和鱼雷完成任务。1957 年，挪威皇家海军仍操作着少量二战时期的驱逐舰，这些舰艇也编入了本次交战的挪威部队。</p>
