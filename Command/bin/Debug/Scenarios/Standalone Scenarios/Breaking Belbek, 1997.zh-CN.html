		<p>日期/时间：1997 年 1 月 2 日 05:00:00 Zulu</p>
		<p>地点：克里米亚</p>
		<p>时长：12 小时</p>
		<p>可玩方：俄罗斯</p>
		<p>自克里米亚半岛移交给乌克兰苏维埃社会主义共和国以来，它一直是争议焦点，直到 2014 年俄罗斯接管。围绕克里米亚或整个乌克兰爆发冲突的可能性一直笼罩着该地区，直到那一年终于爆发。</p>
		<p>本想定设定了一场早得多的克里米亚半岛冲突，目标是塞瓦斯托波尔的别利别克空军基地。乌克兰的军火库尚未严重退化，他们在政治上更愿意反击，而俄罗斯仍在使用未改革的苏联体制。这将是一场激烈的冲突。</p>
		<p>作者：Colin "Coiler12" Salt。</p>
