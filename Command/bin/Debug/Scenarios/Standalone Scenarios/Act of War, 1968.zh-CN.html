		<p>美国对朝鲜</p>
		<p>日期/时间：1968 年 1 月 26 日 / 13:45:00 Zulu</p>
		<p>地点：元山 – 朝鲜</p>
		<p>时长：8 小时</p>
		<p>可玩方：美国</p>
		<p><strong>局势</strong></p>
		<p>1968 年 1 月 23 日，朝鲜巡逻艇在 MiG-21 支援下，在朝鲜郁陵岛东北方向俘获了 USS Pueblo。</p>
		<p>Pueblo 号被俘后，林登·约翰逊总统下令向朝鲜部署美国空军和海军力量以展示武力。</p>
		<p>200 多架飞机的空运和部署代号为“战斗狐”行动；六艘航母及支援舰艇的部署代号为“星队形”行动。</p>
		<p>Paul Bridge，作者与想定设计者。</p>
		<p><strong>作者注：</strong>本想定基于当时的一个选项，即由美国海军营救船员并夺回 USS Pueblo。</p>
