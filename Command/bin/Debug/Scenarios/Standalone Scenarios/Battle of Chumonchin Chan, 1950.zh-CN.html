		<p>原创意：Paul Bridge</p>
		<p>日期：1950 年 7 月 2 日</p>
		<p>地点：朝鲜东海岸</p>
		<p>可玩方：联合国</p>
		<p>时长：4 小时</p>
		<p>注文津海战，或称 1950 年 7 月 2 日行动，是朝鲜战争主要阶段水面战斗舰艇之间唯一一场重大海战。战斗始于一支盟军小舰队遭遇朝鲜人民军海军补给船队。USS Juneau、HMS Black Swan 和 HMS Jamaica 沿日本海（东海）海岸航行时，遇到四艘刚刚护送一支由十艘弹药船组成的船队沿海岸北上的朝鲜鱼雷艇和炮艇。朝鲜鱼雷艇决定抓住机会，开始对盟军舰艇发起攻击。</p>
