		<p>原创意：Patricio Ortiz</p>
		<p>日期：1986 年 4 月 10 日</p>
		<p>地点：加拿大哈利法克斯附近海域</p>
		<p>可玩方：苏联</p>
		<p>时长：16 小时</p>
		<p>华约与北约关系近期急剧恶化，战争似乎迫在眉睫。情报表明，北约部队正在美国和加拿大港口集结，打算在敌对行动开始前出海。为了减轻美加部队对大西洋作战的威胁，政治局决定先发制人，对北美东海岸的北约港口发动破坏性突袭。</p>
		<p>你指挥一艘致命的 877 工程（北约代号：基洛级）柴电潜艇，任务是在哈利法克斯港附近秘密投送一支特种部队，然后布设水雷，并攻击北约的临时航运目标。</p>
