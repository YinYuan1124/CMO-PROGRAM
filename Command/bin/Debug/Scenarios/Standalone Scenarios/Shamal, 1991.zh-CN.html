		<p>原创意：Mike Mykytyn</p>
		<p>日期：1991 年 1 月 20 日</p>
		<p>地点：波斯湾与伊拉克</p>
		<p>可玩方：美国海军、美国空军</p>
		<p>时长：24 小时</p>
		<p>“沙漠风暴”是迄今为止计划最周密、最具决定性的空中战役。战争规划者动用庞大的武器库——原本用于在欧洲对抗华约部队——来系统性地瘫痪并击败当时世界上规模较大、战斗经验较丰富的军队之一。目标清单庞大复杂，要求规划者在推动战争前进的同时，把正确的平台和武器匹配到正确的目标上，并尽量减少损失。这就是本想定的主题。</p>
		<p>这是一个虚构的空战想定，覆盖空战第 4 天，可扮演美国空军（USAF）或美国海军（USN）。</p>
