		<p>原创意：Paul Bridge</p>
		<p>日期：1973 年 10 月 7 日</p>
		<p>地点：叙利亚海岸</p>
		<p>可玩方：以色列</p>
		<p>时长：1 天</p>
		<p>拉塔基亚海战是赎罪日战争中以色列与叙利亚之间一场规模虽小但具有革命性的海战。这是历史上第一次出现导弹交战和电子战欺骗的海战。战斗在叙利亚港口城市拉塔基亚附近进行，以色列人采用的战术是让敌人在最大射程上发射导弹，并用箔条和干扰（ECM）进行防御。等叙利亚人耗尽导弹后，以色列人靠近，在最佳射程上发射“加百列”导弹。</p>
