		<P><STRONG>北约&nbsp;vs. 苏联</STRONG> <!--?xml:namespace prefix = "o" ns = "urn:schemas-microsoft-com:office:office" ?--></P>
		<P><STRONG>日期/时间：</STRONG> 1985 年 4 月 1 日/ 08:00:00 Zulu<BR><STRONG>地点：</STRONG> 北大西洋——巴伦支海<BR><STRONG>时长：</STRONG>&nbsp;1 天<BR><STRONG>可玩阵营：</STRONG>&nbsp;北约</P>
		<P>美国海军第二舰队的驱逐舰“贝德福德”号（USS Bedford）正与挪威海军“纳尔维克”号（HNoMS Narvik）一起在斯瓦尔巴群岛附近巡逻，它们多次遭到苏联飞机飞越，其中包括在主甲板高度进行的低空掠过。</P>
		<P>“贝德福德”号还在声呐上多次捕捉到短暂接触，据信那是一艘位于领海内的不明潜艇。</P>
		<P>尽管敌对行动尚未爆发，“贝德福德”号舰长却执意要逼迫它浮出水面——或者更糟……</P>
