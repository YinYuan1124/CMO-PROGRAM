	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-cbf0f19f-7fff-1e65-df9d-47bd4dd220bf style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>过去一周，巴基斯坦和中国地面部队推进了250多公里，将前线从巴基斯坦纵深推进到印度境内40至70公里处。中国的装甲部队和飞机给印度军队造成了惊人的破坏与混乱，使残余的巴基斯坦部队得以乘势而上。面对这一惊人推进，许多西方观察家担心印度有输掉战争的危险。美军已逼近海岸以展示其存在，一支远征打击群也已部署到该地区。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>美国已命令其在印度的所有平民返回美国，但印度关闭了主要国际机场，使数百名美国人滞留在饱受战火蹂躏的印度。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
