	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-1cbc768c-7fff-db4c-1907-8b5bbbda9aaf style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>美国介入印巴冲突后，战局已完全转向有利于印度一方。在卡拉奇成功登陆后，巴基斯坦通往海洋的主要生命线已被切断。地面战斗十分激烈，双方寸土不让。印度正向巴基斯坦境内推进，但双方都付出了高昂代价。&nbsp;</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>中国已大幅加强其地面介入，并通过大量空中投入和对&nbsp;印度军队的空袭，持续为巴基斯坦提供增援。巴基斯坦空军米安瓦利基地（PAF Mianwali）和穆里德基地（PAF Murid）周边空域是世界上最严密设防的空域，这在很大程度上要归功于中国的综合防空系统（IADS）和战斗空中巡逻（CAP）。印度将难以攻破大伊斯兰堡地区如今形成的坚硬外壳。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
