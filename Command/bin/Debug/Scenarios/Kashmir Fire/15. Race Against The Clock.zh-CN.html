	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-1f886788-7fff-a468-9342-70ae4ebcfad9 style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>印度军队正迅速逼近巴基斯坦抵抗力量最后的据点。战斗异常残酷，双方伤亡数以千计。中国已撤出其大部分部队，但仍有飞机驻扎在巴基斯坦空军基地，以支援日益衰弱的巴基斯坦陆军。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>战争已接近尾声，印度的胜利已清晰可见。巴基斯坦表示将不惜一切手段战斗到底，包括核选项。世界各大国都强烈谴责这一选项，联合国正在紧张地尝试和谈，但印度和巴基斯坦都不满足于任何低于彻底胜利的结果。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
