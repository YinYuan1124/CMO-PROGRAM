	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-1da58e1b-7fff-cab7-8fa4-5db390ec3a32 style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>美国正式介入并对巴基斯坦采取行动一周后，印度已遏止巴基斯坦军队的推进，前线趋于稳定。中国已同时部署“辽宁”号（Liaoning）和“山东”号（Shandong）航母打击群，以对印度军队施加额外压力；美国则作为回应，将“亚伯拉罕·林肯”号（Abraham Lincoln）打击群调往战区。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>中国表示，将迎击任何攻击巴基斯坦目标的美国飞机，这使美军的空中行动略有停顿，军方高层与政界人士正在权衡各种选择。昨夜，国会通过了一项秘密表决，今天这项表决的结果即将揭晓。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
