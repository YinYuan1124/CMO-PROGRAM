	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-eca57a5e-7fff-cf5d-e2cd-ccb74c22637a style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>巴基斯坦和中国在地面上已被挡住，印度军队得以喘息。交战部队大部分位于克什米尔地区及其周边，但南部一直是最具动态的战区。印度在美国的帮助下&nbsp;正全力推进，试图从海上孤立巴基斯坦。上周印美联军在海上取得的重大胜利，使这一目标变得极有可能实现。巴基斯坦已在卡拉奇（Karachi）附近海域布设水雷，以阻止美国和印度船只威胁海岸。&nbsp;</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>印度对这场冲突的未来有着宏大的计划，而今天，这些计划将开始展开。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
