<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>巴基斯坦对印度军队的反击总体上取得成功，巴基斯坦平民所承受的部分压力已有所减轻。中国不再掩饰其介入，已派出飞机和物资支援巴基斯坦。此外，中国两艘航母已离港，正驶往印度战区，准备在印度东半部开辟空中战线。印度海军无力抵抗中国的大规模海上行动，这引发了人们对印度被封锁的担忧。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>印度寻求外国援助，但无一国伸出援手。许多西方国家严厉批评中国的干预，但都没有采取有力措施。美国宣布将向该地区部署“亚伯拉罕·林肯”号（Abraham Lincoln）打击群，以继续保护海上贸易与安全通行。它们将支援目前已部署的“肯尼迪”号（Kennedy）打击群。</FONT></SPAN></P><BR class=Apple-interchange-newline></BODY></html>
