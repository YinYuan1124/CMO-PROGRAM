	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-6bf28e6d-7fff-4031-1189-6209cad31915 style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>在勉强避免核灾难后，印度军队加大了各作战领域的攻势。山地联盟依然坚守，但其空军已彻底崩溃。巴基斯坦军队正在溃退，但正在主要城市和基础设施周围构筑防线。&nbsp;</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>美国和中国军队正从印度洋密切关注局势。美国外交官正试图缓和危机，而中国外交官则试图向巴基斯坦提供补给。有报道称中国飞机正被运往巴基斯坦以补充其日益减少的空军，但这些消息尚未得到证实。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>巴基斯坦海军一直停留在卡拉奇港内，维持其“存在舰队”的地位。由于陆基反舰导弹（SSM）的存在，印度军队始终与海岸保持距离。印度两艘航母因技术问题在冲突初期便退出行动，但它们出现在巴基斯坦近海的日子已为期不远。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
