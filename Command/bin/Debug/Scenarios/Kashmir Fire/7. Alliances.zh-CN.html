	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-82804726-7fff-caf7-6a07-134e5e54b430 style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>印巴战争震惊了世界。印度军队向巴基斯坦主要城市推进的速度令许多外国观察家感到意外，但双方遭受的损失也令人震惊。巴基斯坦濒临战败，已向中国以及其他穆斯林国家恳求外国援助。中国宣布向巴基斯坦派遣一支远征军，以“保护中国人民的利益，维护中国海外资产的安全”。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>沙特阿拉伯和印度尼西亚也响应了巴基斯坦的呼吁，派出部队保护巴基斯坦的重要目标。中国与印度之间的公开冲突似乎尚未迫近，但世界对此可能性深感忧虑。巴基斯坦很可能会试图领导一次对印度军队的新反击，但他们首先需要遏制印度军队和补给向前线的输送。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
