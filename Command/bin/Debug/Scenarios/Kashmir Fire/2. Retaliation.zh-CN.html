	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-02b3afd1-7fff-28aa-d6c8-b247cd02fbaf style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>昨天上午，巴基斯坦军队兑现了其承诺，对任何越境进入巴基斯坦的印度军队发起攻击。除打击巴基斯坦境内的印度军队外，边境另一侧的印度前沿作战基地也遭到袭击。此次巴基斯坦行动还引发了一场空中混战，双方飞机自由交战。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>10月19日下午相对平静，双方暂时停止行动，从上午的事件中恢复。印度民众群情激愤，要求巴基斯坦为印度所遭受的生命损失付出代价。在印度高层官员召开紧急会议后，决定对巴基斯坦军事目标实施报复性打击。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>尽管双方官方都未做好冲突准备，但看来两国不久将陷入全面冲突。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
