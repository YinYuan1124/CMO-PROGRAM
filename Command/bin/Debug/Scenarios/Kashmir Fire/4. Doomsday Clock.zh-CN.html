<html>
	<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><BODY text=#dcdcdc bgColor=#2b2b2b scroll=auto><B id=docs-internal-guid-ecdfe39e-7fff-4791-66ca-4f25ac9aaccf style="FONT-WEIGHT: normal">
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>边境沿线的战斗已持续近两周，双方均未取得重大进展。印度军队在试图逐出拉合尔（Lahore）周边的巴基斯坦军队时伤亡惨重，尽管发动了猛烈的空中和炮火打击，迄今仍未成功。巴基斯坦军队在卡拉奇也极为顽强地抵御了印度相当大规模的地面攻势。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>山地联盟（Mountain Alliance）已证明自己是一块难啃的硬骨头，尽管它没有任何国际支持，还顶住了来自巴基斯坦和印度的攻势。两国都没有投入大量资源来击败山地联盟，但它一直给两国军队制造麻烦。</FONT></SPAN></P><BR>
<P style="MARGIN-BOTTOM: 0pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir=ltr><SPAN style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent"><FONT color=white>山地联盟部队宣称，如果印度军队继续侵犯他们，他们将让这个国家付出代价。印度对此不以为然，因为山地联盟缺乏任何针对印度民众的可信进攻能力——直到十二小时前。</FONT></SPAN></P></B><BR class=Apple-interchange-newline></BODY></html>
